<body>
<style>
/* Layout: één app-kolom. Bovenaan een donkere 'leren' kaart met de verwachting eind van de maand,
   daaronder een raster van 6 kolommen met glazen tegels (⅓, ½, ⅔ of vol breed, versleepbaar), zwevende tabbalk onderin. */
:root {
  --bg: #100E0C;
  --bg2: #191411;
  --ink: #F2EBE1;
  --muted: #A3998D;
  --faint: #6F675E;
  --glass: rgba(255, 244, 228, .055);
  --glass-hi: rgba(255, 244, 228, .10);
  --glass-line: rgba(255, 236, 214, .10);
  --sheet: rgba(30, 25, 21, .90);
  --field: rgba(255, 244, 228, .06);
  --accent: #C9A27A;
  --accent-ink: #17120E;
  --neg: #E3907A;
  --hero-a: #2C2219;
  --hero-b: #120E0B;
  --hero-ink: #F4ECE0;
  --hero-muted: #B3A595;
  --hero-line: rgba(214, 178, 134, .24);
  --hero-neg: #E9997F;
  --glow1: rgba(184, 124, 70, .40);
  --glow2: rgba(122, 46, 58, .28);
  --glow3: rgba(201, 162, 122, .14);
  --shadow: 0 14px 40px rgba(0, 0, 0, .38);
  --c-in: #D9C4A0; --c-uit: #9AA3AE; --c-buy: #D08A5A; --c-cc: #C2707E; --c-kl: #DDA3A8; --c-sav: #93B3A1;
  --cd-in: #D9C4A0; --cd-uit: #9AA3AE; --cd-buy: #D08A5A; --cd-cc: #C2707E; --cd-kl: #DDA3A8; --cd-sav: #93B3A1;
  --r: 12px;
  --r-sm: 8px;
  --f-display: "Hedvig Letters Serif", "Iowan Old Style", "Baskerville", "Times New Roman", serif;
  --f-body: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #EEE7DC; --bg2: #E5DACB; --ink: #1C1713; --muted: #6C6257; --faint: #9C9184;
    --glass: rgba(255, 252, 246, .56); --glass-hi: rgba(255, 252, 246, .80); --glass-line: rgba(70, 50, 30, .11);
    --sheet: rgba(250, 246, 239, .93); --field: rgba(60, 40, 20, .05);
    --accent: #8A5A33; --accent-ink: #FBF6EE; --neg: #A3402C;
    --glow1: rgba(201, 150, 100, .42); --glow2: rgba(160, 100, 107, .20); --glow3: rgba(255, 255, 255, .55);
    --shadow: 0 14px 34px rgba(80, 55, 30, .14);
    --c-in: #8C7656; --c-uit: #4D5560; --c-buy: #9A4F24; --c-cc: #7A2E3A; --c-kl: #A0646B; --c-sav: #4F6B5C;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #EEE7DC; --bg2: #E5DACB; --ink: #1C1713; --muted: #6C6257; --faint: #9C9184;
  --glass: rgba(255, 252, 246, .56); --glass-hi: rgba(255, 252, 246, .80); --glass-line: rgba(70, 50, 30, .11);
  --sheet: rgba(250, 246, 239, .93); --field: rgba(60, 40, 20, .05);
  --accent: #8A5A33; --accent-ink: #FBF6EE; --neg: #A3402C;
  --glow1: rgba(201, 150, 100, .42); --glow2: rgba(160, 100, 107, .20); --glow3: rgba(255, 255, 255, .55);
  --shadow: 0 14px 34px rgba(80, 55, 30, .14);
  --c-in: #8C7656; --c-uit: #4D5560; --c-buy: #9A4F24; --c-cc: #7A2E3A; --c-kl: #A0646B; --c-sav: #4F6B5C;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  font-weight: 400; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(112px + env(safe-area-inset-bottom, 0px));
}
.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(60% 42% at 8% 0%, var(--glow1), transparent 72%),
    radial-gradient(55% 40% at 100% 88%, var(--glow2), transparent 72%),
    radial-gradient(42% 30% at 88% 22%, var(--glow3), transparent 72%),
    linear-gradient(180deg, var(--bg), var(--bg2)); }
.grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: .16; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .45 0 0 0 0 .35 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.shell { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }
.glass { background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3); }

/* bedragen */
.m { white-space: nowrap; -webkit-text-stroke: var(--mstroke, .018em) currentColor; }
.m-c, .m-d { -webkit-text-stroke: .01em currentColor; }
.m-c { font-size: .56em; vertical-align: .52em; margin-right: .1em; opacity: .8; }
.m-d { font-size: .5em; vertical-align: .82em; margin-left: .03em; opacity: .8; }
.m-s { margin-right: .12em; }

/* bovenbalk */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 14px 6px; }
.appbar::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); z-index: -1; background: linear-gradient(var(--bg) 55%, transparent); }
html, body { overflow-x: clip; }
.brand { margin: 0; font-family: var(--f-display); font-weight: var(--dw, 400); font-size: 1.75rem; line-height: 1; letter-spacing: -.01em; }
.brand em { font-style: italic; color: var(--accent); }
.month { display: flex; align-items: center; gap: 2px; border-radius: 999px; padding: 2px; }
.month button { border: 0; background: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; color: var(--muted); }
.month button:active { background: var(--glass-hi); }
.month span { min-width: 7.6em; text-align: center; font-size: .85rem; color: var(--muted); }
.month span em { font-family: var(--f-display); font-weight: var(--dw, 400); font-style: var(--di, italic); font-size: 1.2rem; color: var(--ink); margin-right: 4px; }
.back { border: 0; background: none; color: var(--muted); font-size: .9rem; padding: 6px 0; display: flex; align-items: center; gap: 6px; }
.done-btn { border: 0; border-radius: 999px; padding: 8px 16px; background: var(--ink); color: var(--bg); font-weight: 500; font-size: .88rem; }

/* verwachting */
.hero { position: relative; overflow: hidden; border-radius: calc(var(--r) + 4px); padding: 22px 20px 18px; color: var(--hero-ink);
  background: radial-gradient(120% 90% at 0% 0%, rgba(201, 162, 122, .20), transparent 60%), radial-gradient(90% 80% at 100% 100%, rgba(122, 46, 58, .22), transparent 60%), linear-gradient(160deg, var(--hero-a), var(--hero-b));
  border: 1px solid var(--hero-line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
.h-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.h-eye { margin: 0; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--hero-muted); }
.h-eye em { font-family: var(--f-display); font-weight: var(--dw, 400); font-style: var(--di, italic); text-transform: none; letter-spacing: 0; font-size: 1.45rem; color: var(--hero-ink); margin-left: 4px; }
.h-now { border: 1px solid var(--hero-line); background: none; color: var(--hero-muted); border-radius: 999px; padding: 4px 10px; font-size: .75rem; }
.h-big { margin: -4px 0 0; font-family: var(--f-display); font-weight: var(--dw, 400); font-size: calc(clamp(3.4rem, 17vw, 5.6rem) * var(--ds, 1)); line-height: .95; letter-spacing: -.02em; }
.h-big.neg { color: var(--hero-neg); }
.h-stats { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--hero-line); padding-top: 12px; }
.h-stats div { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding-right: 8px; }
.h-stats div + div { border-left: 1px solid var(--hero-line); padding-left: 12px; }
.h-stats dt { font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--hero-muted); }
.h-stats dd { margin: 0; font-size: clamp(.78rem, 3.6vw, .92rem); font-weight: 500; white-space: nowrap; }
.h-prompt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--hero-line); padding-top: 12px; font-size: .86rem; color: var(--hero-muted); }
.bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: rgba(255, 240, 220, .1); gap: 2px; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 2px; }
.h-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.h-foot div { display: flex; flex-direction: column; gap: 2px; }
.h-foot div:last-child { text-align: right; }
.h-duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding-top: 2px; }
.h-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; container-type: inline-size; text-align: left; border: 0; background: none; color: inherit; padding: 0; }
.h-col + .h-col { border-left: 1px solid var(--hero-line); padding-left: 16px; }
.h-bal { padding-right: 14px; cursor: pointer; }
.h-bal:active .h-num { opacity: .7; }
.h-duo .h-l { min-height: 1.35rem; display: flex; align-items: baseline; gap: 5px; white-space: nowrap; font-size: .64rem; letter-spacing: .15em; text-transform: uppercase; color: var(--hero-muted); }
.h-duo .h-l em { font-family: var(--f-display); font-weight: var(--dw, 400); font-style: var(--di, italic); text-transform: none; letter-spacing: 0; font-size: 1.05rem; color: var(--hero-ink); }
.h-num { font-family: var(--f-display); font-weight: var(--dw, 400); font-size: clamp(1.9rem, 22.5cqi, 3.6rem); line-height: 1; letter-spacing: -.025em; margin-top: 2px; white-space: nowrap; }
.h-num.neg { color: var(--hero-neg); }
.h-sub { font-size: .7rem; color: var(--hero-muted); line-height: 1.4; }
.h-duo .h-l svg { width: 11px; height: 11px; align-self: center; opacity: .75; }
.h-foot .h-l { font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--hero-muted); }
.h-foot b { font-family: var(--f-display); font-weight: var(--dw, 400); font-size: 1.55rem; line-height: 1.05; }
.h-foot b.neg { color: var(--hero-neg); }

/* raster met tegels */
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 10px; }
.slot { grid-column: span var(--w, 2); min-width: 0; position: relative; }
.tile { position: relative; height: 100%; min-height: 116px; border-radius: var(--r); padding: 13px 13px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  container-type: inline-size; cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: background .15s; }
.tile:active { background: var(--glass-hi); }
.t-lbl { display: flex; align-items: center; gap: 7px; font-size: .64rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); font-weight: 500; line-height: 1.25; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
.t-amt { font-family: var(--f-display); font-weight: var(--dw, 400); font-size: calc(clamp(1.3rem, 15.5cqi, 2.5rem) * var(--ds, 1)); line-height: 1; letter-spacing: -.01em; }
.t-amt.neg { color: var(--neg); }
.t-sub { margin-top: 5px; font-size: .72rem; color: var(--muted); line-height: 1.3; }
.t-list { list-style: none; margin: 0; padding: 9px 0 0; border-top: 1px solid var(--glass-line); display: flex; flex-direction: column; gap: 6px; font-size: .76rem; }
.t-list li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.t-list .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.t-list .v { white-space: nowrap; font-variant-numeric: tabular-nums; }
.t-list li.done .n, .t-list li.done .v { opacity: .45; }
.t-list .ic { width: 14px; height: 14px; flex: none; color: var(--c-sav); }
.t-list .pb { width: 40px; height: 3px; border-radius: 2px; background: var(--glass-line); flex: none; overflow: hidden; }
.t-list .pb i { display: block; height: 100%; background: var(--c-sav); }
.t-list .more { color: var(--faint); }

/* bewerken van de indeling */
.edithint { font-size: .8rem; color: var(--muted); text-align: center; padding: 2px 8px; }
.sizer { position: absolute; top: 7px; right: 7px; z-index: 2; display: none; gap: 2px; padding: 2px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--glass-line); }
.sizer button { border: 0; background: none; width: 23px; height: 22px; border-radius: 999px; font-size: .72rem; color: var(--muted); padding: 0; }
.sizer button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
body.editing .sizer { display: flex; }
body.editing .tile { touch-action: none; }
@media (prefers-reduced-motion: no-preference) {
  body.editing .tile { animation: wig .28s ease-in-out infinite alternate; }
  body.editing .slot:nth-child(2n) .tile { animation-delay: -.14s; }
  body.editing .slot[style*="--w:6"] .tile, body.editing .slot[style*="--w:4"] .tile { animation-name: wig3; }
  @keyframes wig { from { transform: rotate(-.7deg); } to { transform: rotate(.7deg); } }
  @keyframes wig3 { from { transform: rotate(-.25deg); } to { transform: rotate(.25deg); } }
}
.slot.ph { border-radius: var(--r); outline: 1px dashed var(--faint); outline-offset: -1px; }
.slot.ph .tile { visibility: hidden; }
.ghost { position: fixed; z-index: 60; pointer-events: none; margin: 0; box-shadow: 0 22px 50px rgba(0, 0, 0, .45); transform: scale(1.04); animation: none !important; }
.ghost .sizer { display: none !important; }

/* detailschermen */
.dhead { display: flex; flex-direction: column; gap: 6px; padding: 6px 2px 2px; }
.dhead h1 { margin: 0; font-family: var(--f-display); font-weight: var(--dw, 400); font-size: 2.3rem; line-height: 1; display: flex; align-items: center; gap: 12px; }
.dhead h1 .dot { width: 9px; height: 9px; }
.dhead .tot { font-family: var(--f-display); font-weight: var(--dw, 400); font-size: 1.5rem; }
.dhead p { margin: 0; color: var(--muted); font-size: .86rem; }
.list { border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; border-top: 1px solid var(--glass-line); }
.list > .row:first-child, .list > :first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 13px 14px 13px 4px; border: 0; background: none; text-align: left; }
.row-main.solo { padding-left: 14px; }
.row-main:active { background: var(--glass-hi); }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .name { overflow-wrap: anywhere; }
.row .meta { font-size: .76rem; color: var(--muted); }
.row .amt { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 500; }
.row.done .name, .row.done .amt { opacity: .45; }
.tag { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-left: 6px; }
.chk { flex: none; width: 44px; height: 46px; border: 0; background: none; display: grid; place-items: center; padding: 0 0 0 4px; }
.chk span { width: 18px; height: 18px; border-radius: 5px; border: 1.25px solid var(--faint); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.chk svg { width: 12px; height: 12px; stroke: var(--accent-ink); stroke-width: 2.4; fill: none; opacity: 0; }
.chk[aria-pressed="true"] span { background: var(--accent); border-color: var(--accent); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.add { display: flex; align-items: center; gap: 8px; width: 100%; padding: 14px; border: 0; border-top: 1px solid var(--glass-line); background: none; color: var(--accent); font-weight: 500; text-align: left; }
.list > .add:first-child { border-top: 0; }
.add:active { background: var(--glass-hi); }
.empty-row { padding: 14px; color: var(--muted); font-size: .86rem; }
.h2 { margin: 8px 2px 0; font-family: var(--f-display); font-weight: var(--dw, 400); font-size: 1.6rem; }
.hint { font-size: .8rem; color: var(--muted); margin: 0; }
.hrow .name { text-transform: capitalize; }
.hrow.cur { background: var(--glass-hi); }
.mini { display: flex; gap: 2px; height: 3px; border-radius: 2px; overflow: hidden; max-width: 240px; margin-top: 5px; }
.mini i { display: block; height: 100%; background: var(--c); border-radius: 2px; }

/* spaarpotjes */
.pots { display: flex; flex-direction: column; gap: 10px; }
.pot { width: 100%; text-align: left; border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.pot:active { background: var(--glass-hi); }
.p-ic { grid-row: span 2; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--glass-line); color: var(--c-sav); background: var(--glass); }
.p-ic svg, .ic svg { width: 20px; height: 20px; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.p-name { font-weight: 500; }
.p-sub { font-size: .76rem; color: var(--muted); grid-column: 2; }
.p-amt { font-family: var(--f-display); font-weight: var(--dw, 400); font-size: 1.5rem; grid-row: 1 / span 2; grid-column: 3; text-align: right; }
.prog { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--glass-line); overflow: hidden; margin-top: 8px; }
.prog i { display: block; height: 100%; background: var(--c-sav); border-radius: 2px; }
.pothead { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px; border-radius: calc(var(--r) + 4px); }
.pothead .p-ic { width: 52px; height: 52px; }
.pothead .p-ic svg { width: 24px; height: 24px; }
.pothead h1 { margin: 0; font-family: var(--f-display); font-weight: var(--dw, 400); font-size: 2.1rem; line-height: 1; }
.pothead .big { font-family: var(--f-display); font-weight: var(--dw, 400); font-size: calc(clamp(2.6rem, 12vw, 3.6rem) * var(--ds, 1)); line-height: 1; }
.pothead .prog { width: 100%; height: 4px; margin-top: 0; }
.pothead .hint { width: 100%; }

.panel { border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel p { margin: 0; }

  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  const S = Object.assign(normalize(saved), { month: NOW, view: "overview", editing: false, pendingRestore: null, fresh: !saved });
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 2, items: S.items, balances: S.balances, ccs: S.ccs, pots: S.pots, paid: S.paid, set: S.set, lastBackup: S.lastBackup })); }
    catch (e) { toast("Opslaan lukte niet. Je toestel blokkeert opslag of zit vol."); }
  }
  if (saved && saved.v !== 2) persist(); // oude opslag direct omzetten naar het nieuwe formaat
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  const isPaid = (m, id) => !!(S.paid[m] && S.paid[m][id]);
  function setPaid(m, id, v) {
    S.paid[m] = S.paid[m] || {};

    if (!Object.keys(S.paid[m]).length) delete S.paid[m];
  }
  function upsert(item) { const i = S.items.findIndex(x => x.id === item.id); if (i >= 0) S.items[i] = item; else S.items.push(item); persist(); render(); }
  function removeItem(id) { S.items = S.items.filter(x => x.id !== id); Object.keys(S.paid).forEach(m => setPaid(m, id, false)); persist(); render(); }

  /* ---------- berekening ---------- */
  function potAt(pot, m) {
    const snapM = Object.keys(pot.snaps).filter(k => k <= m).sort().pop();
    let total = snapM ? Number(pot.snaps[snapM].amount) || 0 : 0;
    const deps = S.items.filter(i => i.kind === "dep" && i.potId === pot.id);
    if (!deps.length) return total;
    let start = snapM || deps.map(depStart).sort()[0];
    for (let k = start, n = 0; k <= m && n < 600; k = addMonths(k, 1), n++) {
      for (const d of deps) {
        const v = depAt(d, k); if (!v) continue;
        if (snapM && k === snapM && isPaid(k, d.id)) continue; // al verwerkt in het ingevulde bedrag
        total += v;

    return total;
  }
  function balAt(m) {
    const k = Object.keys(S.balances).filter(x => x <= m).sort().pop();

  }
  function valueAt(it, m) {
    if (it.kind === "in" || it.kind === "uit") return monthly(entryAt(it, m));
    if (it.kind === "buy") return String(it.date || "").startsWith(m) ? Number(it.amount) || 0 : 0;
    if (it.kind === "kl") { const k = klarnaAt(it, m); return k ? k.share : 0; }
    if (it.kind === "dep") return depAt(it, m);
    return 0;
  }
  // past het saldo van maand m aan met een bedrag; geeft false als er nog geen saldo bekend is
  function adjustBalance(m, delta) {
    if (!delta) return true;
    const b = balAt(m); if (!b) return false;
    S.balances[m] = { ...(S.balances[m] || {}), amount: r2(Number(b.amount) + delta), at: Date.now() };
    return true;
  }
  function togglePaid(id) {
    const m = S.month, it = S.items.find(i => i.id === id); if (!it) return;
    const on = !isPaid(m, id); setPaid(m, id, on);
    const v = r2(valueAt(it, m));
    if (it.kind === "kl") {
      const cur = S.ccs[m];
      S.ccs[m] = { ...(cur || {}), amount: r2((cur ? Number(cur.amount) || 0 : 0) + (on ? v : -v)), at: Date.now() };
      toast(on ? `${eur.format(v)} op je creditcard gezet` : `${eur.format(v)} van je creditcard gehaald`);
    } else {
      const inc = it.kind === "in";
      if (adjustBalance(m, (inc ? 1 : -1) * (on ? v : -v)))
        toast(inc ? (on ? `${eur.format(v)} bijgeschreven op je saldo` : `${eur.format(v)} weer van je saldo gehaald`)
                  : (on ? `${eur.format(v)} afgeschreven van je saldo` : `${eur.format(v)} teruggezet op je saldo`));

  function calc(m) {
    const r = { in: [], uit: [], buy: [], kl: [], dep: [] };
    for (const it of S.items) {
      if (it.kind === "in" || it.kind === "uit") { const e = entryAt(it, m); if (e) r[it.kind].push({ it, e, v: monthly(e) }); }
      else if (it.kind === "buy") { if (String(it.date || "").startsWith(m)) r.buy.push({ it, v: Number(it.amount) || 0 }); }
      else if (it.kind === "kl") { const k = klarnaAt(it, m); if (k) r.kl.push({ it, k, v: k.share }); }
      else if (it.kind === "dep") { const v = depAt(it, m); const pot = S.pots.find(p => p.id === it.potId); if (v > 0 && pot) r.dep.push({ it, v, pot }); }
    }
    for (const k in r) r[k].forEach(x => x.done = isPaid(m, x.it.id));
    r.in.sort((a, b) => b.v - a.v); r.uit.sort((a, b) => b.v - a.v); r.kl.sort((a, b) => b.v - a.v);
    r.buy.sort((a, b) => String(b.it.date).localeCompare(String(a.it.date)));
    const sum = a => a.reduce((s, x) => s + x.v, 0), left = a => a.filter(x => !x.done).reduce((s, x) => s + x.v, 0);

    r.t = { in: sum(r.in), uit: sum(r.uit), buy: sum(r.buy), kl: sum(r.kl), sav: sum(r.dep), cc: r.ccStand ? Number(r.ccStand.amount) || 0 : 0 };

    r.costLeft = left(r.uit) + left(r.buy) + r.klLeft + left(r.dep) + (r.ccDone ? 0 : r.t.cc);
    r.bal = balAt(m);
    r.expected = r.bal ? r.bal.amount + r.inLeft - r.costLeft : null;

  }
  function firstMonth() {

    for (const it of S.items) see(it.kind === "buy" ? String(it.date || "").slice(0, 7) : it.kind === "kl" ? it.start : it.kind === "dep" ? depStart(it) : histOf(it)[0].from);
    [S.balances, S.ccs].forEach(o => Object.keys(o).forEach(see));

  }

  /* ---------- kleuren en thema ---------- */
  const root = document.documentElement;
  let themeIsOurs = false;
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  function isDark() {
    if (S.set.theme === "dark") return true;

    const host = themeIsOurs ? null : root.getAttribute("data-theme");

  }
  const pal = id => PALETTE.find(x => x[0] === id) || PALETTE[0];
  function applyTheme() {
    if (S.set.theme === "auto") { if (themeIsOurs) { root.removeAttribute("data-theme"); themeIsOurs = false; } }
    else { root.setAttribute("data-theme", S.set.theme); themeIsOurs = true; }
    const dark = isDark(), c = S.set.colors;
    root.style.setProperty("--accent", dark ? pal(c.accent)[3] : pal(c.accent)[2]);
    ["in", "uit", "buy", "cc", "kl", "sav"].forEach(k => {
      root.style.setProperty("--c-" + k, dark ? pal(c[k])[3] : pal(c[k])[2]);
      root.style.setProperty("--cd-" + k, pal(c[k])[3]);
    });
    const f = FONTS.find(x => x[0] === S.set.font) || FONTS[0];
    root.style.setProperty("--f-display", `${f[2]}, "Iowan Old Style", "Baskerville", "Times New Roman", serif`);
    root.style.setProperty("--dw", f[3]); root.style.setProperty("--di", f[4]); root.style.setProperty("--ds", f[5]);
    // achtergrondgloed

    const k = { zacht: .5, normaal: 1, sterk: 1.55 }[S.set.bg.strength] || 1;
    const glow = (id, aDark, aLight) => id === "none" ? "transparent" : hexA(dark ? pal(id)[2] : pal(id)[3], Math.min(.95, (dark ? aDark : aLight) * k));

      return `<button class="pot glass" data-pot="${esc(p.id)}"><span class="p-ic">${icon(p.icon)}</span><span class="p-name">${esc(p.name)}</span>

        ${p.goal ? `<span class="prog"><i style="width:${Math.min(100, l.v / p.goal * 100).toFixed(1)}%"></i></span>` : ""}</button>`;
    }).join("");
    return `<div class="dhead"><h1><span class="dot" style="--c:var(--c-sav)"></span>Sparen</h1>
      <p class="num"><span class="tot">${money(c.savTotal)}</span> verwacht eind ${esc(mN)}</p>
      ${S.pots.length ? "" : `<p class="hint">Maak potjes voor je spaardoelen en stel in wat je elke maand inlegt.</p>`}</div>
      <div class="pots">${cards || `<div class="panel glass"><p class="hint">Nog geen potjes. Begin bijvoorbeeld met een buffer of een reis.</p></div>`}</div>
      <div class="btns"><button class="btn primary" data-act="new-pot">+ Nieuw potje</button></div>`;
  }
  function potView(id) {
    const p = S.pots.find(x => x.id === id);
    if (!p) { S.view = "sav"; return savView(); }
    const c = calc(S.month), mN = monthName(S.month, false), v = potAt(p, S.month);
    const snapM = Object.keys(p.snaps).filter(k => k <= S.month).sort().pop();
    const snap = snapM ? p.snaps[snapM] : null;
    const deps = c.dep.filter(d => d.pot.id === p.id);
    const rows = deps.map(r => checkRow(r, "Overgemaakt", r.it.once ? "Eenmalig" : "Elke maand", `+ ${eur.format(r.v)}`)).join("");
    return `<section class="pothead glass"><span class="p-ic">${icon(p.icon)}</span><h1>${esc(p.name)}</h1>
        <p class="hint">Verwacht eind ${esc(mN)}</p><div class="big num">${money(v)}</div>
        ${p.goal ? `<div class="prog"><i style="width:${Math.min(100, v / p.goal * 100).toFixed(1)}%"></i></div><p class="hint num">${Math.round(v / p.goal * 100)}% van je doel van ${eur.format(p.goal)}${v < p.goal ? ` · nog ${eur.format(p.goal - v)}` : " · doel bereikt"}</p>` : ""}
        <p class="hint">${snap ? `Laatst ingevuld: ${eur.format(snap.amount)} in ${esc(monthName(snapM))}` : "Nog geen bedrag ingevuld. Alleen je stortingen tellen mee."}</p>
        <div class="btns"><button class="btn primary" data-pot-bal="${esc(p.id)}">Bedrag bijwerken</button><button class="btn" data-dep="${esc(p.id)}">+ Storting</button></div></section>
      <h2 class="h2">Stortingen in ${esc(mN)}</h2>
      <div class="list glass">${rows || `<div class="empty-row">Geen stortingen in ${esc(mN)}.</div>`}<button class="add" data-dep="${esc(p.id)}">+ Storting toevoegen</button></div>
      <button class="link" data-pot-edit="${esc(p.id)}">Potje bewerken of verwijderen</button>`;
  }

  function history() {
    const first = firstMonth();
    if (!first) return `<h1 class="h2">Maanden</h1><section class="panel glass"><p class="hint">Zodra je bedragen invult, zie je hier per maand wat er binnenkwam, wat eraf ging en wat je overhield.</p></section>`;
    const last = S.month > NOW ? S.month : NOW, months = [];
    for (let m = last; m >= first && months.length < 36; m = addMonths(m, -1)) months.push(m);
    const rows = months.map(m => {
      const c = calc(m), sc = Math.max(c.t.in, c.costs) || 1, w = v => (Math.max(0, v) / sc * 100).toFixed(1) + "%";
      return `<div class="row ${m === S.month ? "hrow cur" : "hrow"}"><button class="row-main solo" data-month="${m}"><span class="txt"><span class="name">${esc(monthName(m))}</span>
        <span class="mini" aria-hidden="true"><i style="width:${w(c.t.uit)};--c:var(--c-uit)"></i><i style="width:${w(c.t.buy)};--c:var(--c-buy)"></i><i style="width:${w(c.t.cc)};--c:var(--c-cc)"></i><i style="width:${w(c.t.kl)};--c:var(--c-kl)"></i><i style="width:${w(c.t.sav)};--c:var(--c-sav)"></i></span>
        <span class="meta num">${eur.format(c.t.in)} in · ${eur.format(c.costs)} eruit${c.t.sav ? ` · ${eur.format(c.t.sav)} gespaard` : ""}</span></span>
        <span class="amt" style="font-family:var(--f-display);font-size:1.3rem;font-weight:var(--dw,400)">${money(c.over)}</span></button></div>`;
    }).join("");
    return `<h1 class="h2">Maanden</h1><div class="list glass">${rows}</div>`;
  }

  function more() {
    const dark = isDark();
    const colorRows = COLOR_TARGETS.map(([key, label, sub]) => {
      const cur = S.set.colors[key];
      return `<div class="crow"><span class="clabel">${esc(label)} <small>${esc(sub || pal(cur)[1])}</small></span>
        <div class="swatches" role="radiogroup" aria-label="Kleur voor ${esc(label)}">${PALETTE.map(([id, nm, l, d]) =>
          `<button class="sw" role="radio" aria-checked="${id === cur}" aria-label="${nm}" title="${nm}" data-color="${key}:${id}" style="--sw:${dark ? d : l}"></button>`).join("")}</div></div>`;

      <section class="panel glass"><h3>Weergave</h3>
        <fieldset class="field"><legend>Licht of donker</legend><div class="seg">${th.map(([v, l]) => `<input type="radio" name="theme" id="th-${v}" value="${v}" ${S.set.theme === v ? "checked" : ""}><label for="th-${v}">${l}</label>`).join("")}</div></fieldset>
        <div class="field"><label for="set-name">Naam bovenin</label><input id="set-name" maxlength="20" autocomplete="off" value="${esc(S.set.name)}" placeholder="Saldo"></div></section>
      <section class="panel glass"><h3>Kleuren</h3>${colorRows}<button class="link" data-act="reset-colors">Standaardkleuren terugzetten</button></section>
      <section class="panel glass"><h3>Achtergrond</h3>${[["top", "Gloed linksboven"], ["bottom", "Gloed rechtsonder"]].map(([pos, label]) => {
        const cur = S.set.bg[pos];
        return `<div class="crow"><span class="clabel">${label} <small>${cur === "none" ? "Geen" : esc(pal(cur)[1])}</small></span>
          <div class="swatches" role="radiogroup" aria-label="${label}"><button class="sw sw-none" role="radio" aria-checked="${cur === "none"}" aria-label="Geen" title="Geen" data-bg="${pos}:none"></button>${PALETTE.map(([id, nm, l, d]) =>
            `<button class="sw" role="radio" aria-checked="${id === cur}" aria-label="${nm}" title="${nm}" data-bg="${pos}:${id}" style="--sw:${dark ? l : d}"></button>`).join("")}</div></div>`;
      }).join("")}
        <fieldset class="field"><legend>Sterkte</legend><div class="seg">${[["zacht", "Zacht"], ["normaal", "Normaal"], ["sterk", "Sterk"]].map(([v, l]) => `<input type="radio" name="bgs" id="bgs-${v}" value="${v}" ${S.set.bg.strength === v ? "checked" : ""}><label for="bgs-${v}">${l}</label>`).join("")}</div></fieldset>
        <button class="link" data-act="reset-bg">Standaard achtergrond terugzetten</button></section>
      <section class="panel glass"><h3>Indeling</h3><p class="hint">Houd op het overzicht een tegel ingedrukt om hem te verschuiven of breder te maken.</p>
        <div class="btns"><button class="btn" data-act="edit-layout">Indeling aanpassen</button><button class="btn" data-act="reset-layout">Standaard indeling</button></div></section>
      <section class="panel glass"><h3>Back-up en Excel</h3>
        <p class="hint">Alles staat alleen op dit toestel. ${S.lastBackup ? "Laatste back-up: " + esc(niceDate(S.lastBackup)) + "." : "Er is nog geen back-up gemaakt."}</p>
        <div class="btns"><button class="btn primary" data-act="backup">Back-up maken</button><button class="btn" data-act="excel">Download als Excel</button><button class="btn" data-act="restore">Back-up terugzetten</button></div>${restore}</section>
      <section class="panel glass"><h3>Voorbeelden</h3><div class="btns">${hasEx ? `<button class="btn" data-act="unseed">Voorbeelden wissen</button>` : `<button class="btn" data-act="seed">Voorbeelden laden</button>`}</div></section>`;
  }

  /* ---------- tegels verschuiven ---------- */
  let press = null, drag = null, suppressClick = false, scrollRAF = 0;
  function setEditing(v) { S.editing = v; document.body.classList.toggle("editing", v); render(); }
  function renderGridAnimated() {
    const grid = document.getElementById("grid"); if (!grid) return;
    const before = {};
    grid.querySelectorAll(".slot").forEach(el => before[el.dataset.tile] = el.getBoundingClientRect());
    grid.innerHTML = gridHtml(calc(S.month));
    if (reduced()) return;
    grid.querySelectorAll(".slot").forEach(el => {
      const b = before[el.dataset.tile]; if (!b) return;
      const a = el.getBoundingClientRect(), dx = b.left - a.left, dy = b.top - a.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 240, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }
  function startDrag(id, x, y) {
    const slot = document.querySelector(`.slot[data-tile="${id}"]`); if (!slot) return;
    const rect = slot.getBoundingClientRect();
    const ghost = slot.querySelector(".tile").cloneNode(true);
    ghost.classList.add("ghost");
    Object.assign(ghost.style, { left: rect.left + "px", top: rect.top + "px", width: rect.width + "px", height: rect.height + "px" });
    document.body.appendChild(ghost);
    slot.classList.add("ph");
    drag = { id, ghost, ox: x - rect.left, oy: y - rect.top, x, y, last: null };
    scrollLoop();
  }
  function moveDrag(x, y) {
    drag.x = x; drag.y = y;
    drag.ghost.style.left = (x - drag.ox) + "px";
    drag.ghost.style.top = (y - drag.oy) + "px";
    // na een verschuiving even rust, zodat tegels niet doorspringen
    if (drag.lock && (Date.now() < drag.lock.t || Math.hypot(x - drag.lock.x, y - drag.lock.y) < 24)) return;
    let target = null;
    document.querySelectorAll("#grid .slot").forEach(el => {
      if (el.dataset.tile === drag.id) return;
      const r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) target = el.dataset.tile;
    });
    if (target && target !== drag.last) {
      const L = S.set.layout, from = L.findIndex(t => t.id === drag.id), to = L.findIndex(t => t.id === target);
      const [it] = L.splice(from, 1); L.splice(to, 0, it);
      renderGridAnimated();
      drag.lock = { t: Date.now() + 280, x, y };
    }
    drag.last = target;
  }
  function scrollLoop() {
    cancelAnimationFrame(scrollRAF);
    const step = () => {
      if (!drag) return;
      const edge = 90, h = window.innerHeight;
      if (drag.y < edge) window.scrollBy(0, -Math.ceil((edge - drag.y) / 8));
      else if (drag.y > h - edge - 40) window.scrollBy(0, Math.ceil((drag.y - (h - edge - 40)) / 8));
      scrollRAF = requestAnimationFrame(step);
    };
    scrollRAF = requestAnimationFrame(step);
  }
  function endDrag() {
    const d = drag; drag = null; cancelAnimationFrame(scrollRAF);
    const slot = document.querySelector(`.slot[data-tile="${d.id}"]`);
    const finish = () => { d.ghost.remove(); if (slot) slot.classList.remove("ph"); };
    if (slot && !reduced()) {
      const r = slot.getBoundingClientRect();
      const a = d.ghost.animate([{ left: d.ghost.style.left, top: d.ghost.style.top, transform: "scale(1.04)" }, { left: r.left + "px", top: r.top + "px", transform: "scale(1)" }], { duration: 180, easing: "ease-out", fill: "forwards" });
      a.onfinish = finish;
    } else finish();
    persist();
    setTimeout(() => { suppressClick = false; }, 80);
  }
  document.addEventListener("pointerdown", e => {
    if (S.view !== "overview" || e.button > 0) return;
    const slot = e.target.closest("#grid .slot"); if (!slot || e.target.closest(".sizer")) return;
    const id = slot.dataset.tile;
    if (S.editing) { e.preventDefault(); suppressClick = true; startDrag(id, e.clientX, e.clientY); return; }
    press = { id, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY };
    press.timer = setTimeout(() => {
      const p = press; press = null; if (!p) return;
      suppressClick = true;
      setEditing(true);
      startDrag(p.id, p.lx, p.ly);
    }, 450);
  });
  document.addEventListener("pointermove", e => {
    if (press) { press.lx = e.clientX; press.ly = e.clientY; if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 9) { clearTimeout(press.timer); press = null; } }
    if (drag) moveDrag(e.clientX, e.clientY);
  });
  const endPress = () => { if (press) { clearTimeout(press.timer); press = null; } if (drag) endDrag(); };
  document.addEventListener("pointerup", endPress);
  document.addEventListener("pointercancel", endPress);
  document.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", e => { if (e.target.closest(".slot")) e.preventDefault(); });

  /* ---------- klikken ---------- */
  document.addEventListener("click", e => {
    if (e.target.closest("#sheetHost")) return;
    if (suppressClick) { suppressClick = false; return; }
    const t = e.target;
    const sz = t.closest("[data-size]");
    if (sz) { const [id, w] = sz.dataset.size.split(":"); const it = S.set.layout.find(x => x.id === id); if (it) { it.w = Number(w); persist(); renderGridAnimated(); } return; }
    if (S.editing && S.view === "overview") {
      if (t.closest("[data-act='edit-done']") || !t.closest(".slot")) { setEditing(false); }
      return;
    }
    const tab = t.closest("[data-tab]"); if (tab) return go(tab.dataset.tab);
    if (t.closest("#tabAdd")) return openChooser();
    const pd = t.closest("[data-paid]");
    if (pd) { togglePaid(pd.dataset.paid); return; }
    const st = t.closest("[data-stand]"); if (st) return openStand(st.dataset.stand);
    const ad = t.closest("[data-add]"); if (ad) return openSheet(ad.dataset.add);
    const ed = t.closest("[data-edit]");
    if (ed) { const it = S.items.find(i => i.id === ed.dataset.edit); if (it) it.kind === "dep" ? openDeposit({ item: it }) : openSheet(it.kind, it); return; }
    const op = t.closest("[data-open]"); if (op) return go("detail:" + op.dataset.open);
    const g = t.closest("[data-go]"); if (g) return go(g.dataset.go);
    const pt = t.closest("[data-pot]"); if (pt) return go("pot:" + pt.dataset.pot);
    const pb = t.closest("[data-pot-bal]"); if (pb) return openPotBalance(pb.dataset.potBal);
    const pe = t.closest("[data-pot-edit]"); if (pe) return openPot(S.pots.find(p => p.id === pe.dataset.potEdit));
    const dp = t.closest("[data-dep]"); if (dp) return openDeposit({ potId: dp.dataset.dep });
    const hm = t.closest("[data-month]"); if (hm) { S.month = hm.dataset.month; return go("overview"); }
    const fo = t.closest("[data-font]");
    if (fo) { S.set.font = fo.dataset.font; persist(); applyTheme(); render(); return; }
    const bgb = t.closest("[data-bg]");
    if (bgb) { const [pos, id] = bgb.dataset.bg.split(":"); S.set.bg[pos] = id; persist(); applyTheme(); render(); return; }
    const sw = t.closest("[data-color]");
    if (sw) { const [k, id] = sw.dataset.color.split(":"); S.set.colors[k] = id; persist(); applyTheme(); render(); return; }
    const a = t.closest("[data-act]"); if (!a) return;
    switch (a.dataset.act) {
      case "prev": S.month = addMonths(S.month, -1); render(); break;
      case "next": S.month = addMonths(S.month, 1); render(); break;
      case "now": S.month = NOW; render(); break;
      case "new-pot": openPot(); break;
      case "edit-layout": S.view = "overview"; setEditing(true); window.scrollTo({ top: 0 }); break;
      case "reset-layout": S.set.layout = normLayout([]); persist(); toast("Standaard indeling terug"); break;
      case "reset-bg": S.set.bg = Object.assign({}, DEFAULT_BG); persist(); applyTheme(); render(); toast("Standaard achtergrond terug"); break;
      case "reset-colors": S.set.colors = Object.assign({}, DEFAULT_COLORS); persist(); applyTheme(); render(); toast("Standaardkleuren terug"); break;
      case "seed": seed(); toast("Voorbeelden geladen"); break;
      case "unseed": unseed(); toast("Voorbeelden gewist"); break;
      case "backup": backup(); break;
      case "excel": exportXlsx(a); break;
      case "restore": if (PREVIEW) return toast("Terugzetten werkt in de echte app op je telefoon."); document.getElementById("restoreInput").click(); break;
      case "restore-no": S.pendingRestore = null; render(); break;
      case "restore-yes": {
        const d = S.pendingRestore.data; S.pendingRestore = null;
        Object.assign(S, { items: d.items, balances: d.balances, ccs: d.ccs, pots: d.pots, paid: d.paid, set: d.set });
        S.month = NOW; persist(); applyTheme(); go("overview"); toast("Back-up teruggezet"); break;
      }
    }
  });
  document.addEventListener("change", e => {
    if (e.target.name === "theme") { S.set.theme = e.target.value; persist(); applyTheme(); render(); }
    if (e.target.name === "bgs") { S.set.bg.strength = e.target.value; persist(); applyTheme(); }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "set-name") { S.set.name = e.target.value; persist(); const l = document.getElementById("logoName"); if (l) l.textContent = appName(); }
  });

  /* ---------- panelen ---------- */
  const host = document.getElementById("sheetHost");
  let lastFocus = null;
  const $ = id => document.getElementById(id);
  function mount(html, focusId) {
    lastFocus = document.activeElement;
    host.innerHTML = `<div class="scrim" id="scrim">${html}</div>`;
    $("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
    const cancel = $("f-cancel"); if (cancel) cancel.onclick = closeSheet;
    if (focusId) setTimeout(() => { const f = $(focusId); if (f) f.focus(); }, 40);
  }
  function closeSheet() { host.innerHTML = ""; if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus(); }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && host.firstChild) closeSheet(); });
  function showErr(msg, focusId) { const el = $("f-err"); if (!el) return; el.textContent = msg; el.hidden = false; if (focusId && $(focusId)) $(focusId).focus(); }
  const amountField = (id, label, val) => `<div class="field"><label for="${id}">${label}</label><div class="amount-wrap"><span>€</span>
      <input id="${id}" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${val != null && val !== "" ? esc(String(val).replace(".", ",")) : ""}"></div></div>`;
  const footer = (del, delLabel) => `<p class="err" id="f-err" hidden></p><div id="f-confirm"></div>
      <div class="btns">${del ? `<button type="button" class="btn danger" id="f-del">${delLabel || "Verwijderen"}</button>` : ""}
      <div class="right"><button type="button" class="btn" id="f-cancel">Annuleren</button><button type="submit" class="btn primary">Opslaan</button></div></div>`;

  function openChooser() {
    const opt = (k, title, sub, c) => `<button type="button" data-pick="${k}"><b><span class="dot" style="--c:${c}"></span>${title}</b><small>${sub}</small></button>`;
    mount(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><h2 id="sh-t">Wat wil je toevoegen?</h2>
      <div class="choose">${opt("buy", "Aankoop", "Pinbetaling of losse uitgave", "var(--c-buy)")}${opt("dep", "Storting", "Naar een spaarpotje", "var(--c-sav)")}
      ${opt("cc", "Creditcard", "Tussenstand bijwerken", "var(--c-cc)")}${opt("kl", "Klarna", "Aankoop of termijnen", "var(--c-kl)")}
      ${opt("uit", "Vaste last", "Elke maand", "var(--c-uit)")}${opt("in", "Inkomen", "Elke maand", "var(--c-in)")}
      ${opt("bal", "Saldo", "Stand lopende rekening", "var(--ink)")}${opt("pot", "Spaarpotje", "Nieuw spaardoel", "var(--c-sav)")}</div>
      <div class="btns"><div class="right"><button type="button" class="btn" id="f-cancel">Annuleren</button></div></div></div>`);
    host.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
      const k = b.dataset.pick; closeSheet();
      if (k === "bal" || k === "cc") openStand(k);
      else if (k === "dep") S.pots.length ? openDeposit({}) : (toast("Maak eerst een spaarpotje"), openPot());
      else if (k === "pot") openPot();
      else openSheet(k);
    });
  }

  function openStand(type) {
    const isCC = type === "cc", store = isCC ? S.ccs : S.balances, cur = isCC ? store[S.month] : balAt(S.month);
    const paid = isCC && isPaid(S.month, "cc");
    mount(`<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate>
      <h2 id="sh-t"><span class="dot" style="--c:${isCC ? "var(--c-cc)" : "var(--ink)"}"></span>${isCC ? "Creditcard" : "Lopende rekening"}</h2>
      ${amountField("f-amt", isCC ? "Tussenstand deze maand" : "Wat staat er nu op je rekening?", cur ? cur.amount : "")}
      <p class="hint">${esc(monthName(S.month))}${cur ? " · vorige stand " + esc(whenText(cur.at)) : ""}. ${isCC ? "Dit bedrag gaat eind van de maand van je rekening af." : "Rood staan? Zet er een min voor."}</p>
      ${isCC ? `<button type="button" class="toggle" id="f-ccpaid" aria-pressed="${paid}"><span class="chk" style="width:30px;padding:0" aria-pressed="${paid}">${CHECK}</span>Al afgeschreven van mijn rekening</button>` : ""}
      ${footer(false)}</form>`, "f-amt");
    let ccPaid = paid;
    if (isCC) $("f-ccpaid").onclick = () => { ccPaid = !ccPaid; $("f-ccpaid").setAttribute("aria-pressed", ccPaid); $("f-ccpaid").querySelector(".chk").setAttribute("aria-pressed", ccPaid); };
    $("sheet").addEventListener("submit", e => {
      e.preventDefault();
      const v = parseAmount($("f-amt").value, !isCC);
      if (isNaN(v)) return showErr("Vul een bedrag in, bijvoorbeeld 1.250,00.", "f-amt");
      if (isCC) {

      persist(); closeSheet(); render(); toast(isCC ? "Tussenstand bijgewerkt" : "Saldo bijgewerkt");

  /* ---------- back-up en Excel ---------- */
  async function giveFile(blob, filename) {
    try {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; }
    } catch (e) { if (e && e.name === "AbortError") return false; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return true;
  }
  async function backup() {
    if (PREVIEW) return toast("Back-ups maken werkt in de echte app op je telefoon.");
    const payload = JSON.stringify({ app: "saldo", v: 2, date: Date.now(), items: S.items, balances: S.balances, ccs: S.ccs, pots: S.pots, paid: S.paid, set: S.set }, null, 1);
    if (await giveFile(new Blob([payload], { type: "application/json" }), `saldo-backup-${today()}.json`)) { S.lastBackup = Date.now(); persist(); render(); toast("Back-up gemaakt"); }
  }
  document.getElementById("restoreInput").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d || d.app !== "saldo" || !Array.isArray(d.items)) throw 0;
        S.pendingRestore = { data: normalize(d), date: d.date || null }; render();
      } catch (err) { toast("Dit bestand is geen back-up van " + appName() + "."); }
    };
    rd.readAsText(f);
  });
  let xlsxP = null;
  const loadXlsx = () => window.XLSX ? Promise.resolve() : (xlsxP = xlsxP || new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "xlsx.full.min.js"; s.onload = res; s.onerror = () => { xlsxP = null; rej(); }; document.head.appendChild(s);
  }));
  if (!PREVIEW) setTimeout(() => loadXlsx().catch(() => {}), 1500);
  async function exportXlsx(btn) {
    if (PREVIEW) return toast("Excel downloaden werkt in de echte app op je telefoon.");
    if (!window.XLSX) { btn.disabled = true; try { await loadXlsx(); toast("Klaar. Tik nog een keer op Download als Excel."); } catch (e) { toast("Het Excel-onderdeel kon niet laden. Probeer het met internet opnieuw."); } btn.disabled = false; return; }
    const first = firstMonth() || NOW, months = [];
    for (let m = first; m <= NOW; m = addMonths(m, 1)) months.push(m);
    const per = [["Maand", "Inkomsten", "Vaste lasten", "Aankopen", "Creditcard", "Klarna", "Inleg sparen", "Over", "Saldo rekening", "Verwacht eind maand", "Spaargeld"]]
      .concat(months.map(m => { const c = calc(m); return [monthName(m), r2(c.t.in), r2(c.t.uit), r2(c.t.buy), r2(c.t.cc), r2(c.t.kl), r2(c.t.sav), r2(c.over), c.bal ? c.bal.amount : "", c.expected != null ? r2(c.expected) : "", r2(c.savTotal)]; }));
    const fixedRows = [["Soort", "Omschrijving", "Categorie", "Vanaf", "Tot en met", "Bedrag", "Hoe vaak", "Per maand"]];
    S.items.filter(i => i.kind === "in" || i.kind === "uit").forEach(it => {
      const h = histOf(it);
      h.forEach((e, k) => fixedRows.push([it.kind === "in" ? "Inkomen" : "Vaste last", it.name, it.cat || "", e.from === "0000-01" ? "" : e.from,
        k < h.length - 1 ? addMonths(h[k + 1].from, -1) : (it.until ? addMonths(it.until, -1) : ""), e.amount, FREQ_LABEL[e.freq], r2(monthly(e))]));
    });
    const buys = [["Datum", "Omschrijving", "Bedrag"]].concat(S.items.filter(i => i.kind === "buy").sort((a, b) => a.date.localeCompare(b.date)).map(i => [i.date, i.name, i.amount]));
    const kl = [["Omschrijving", "Totaal", "Termijnen", "Eerste betaling", "Per termijn"]].concat(S.items.filter(i => i.kind === "kl").map(i => [i.name, i.amount, i.terms, i.start, r2(i.amount / i.terms)]));
    const pots = [["Potje", "Doel", "Verwacht eind " + monthName(NOW)]].concat(S.pots.map(p => [p.name, p.goal || "", r2(potAt(p, NOW))]));
    const deps = [["Potje", "Soort", "Vanaf / maand", "Tot en met", "Bedrag"]];
    S.items.filter(i => i.kind === "dep").forEach(it => {
      const pn = (S.pots.find(p => p.id === it.potId) || {}).name || "";
      if (it.once) deps.push([pn, "Eenmalig", it.once, "", it.amount]);
      else { const h = histOf(it); h.forEach((e, k) => deps.push([pn, "Elke maand", e.from, k < h.length - 1 ? addMonths(h[k + 1].from, -1) : (it.until ? addMonths(it.until, -1) : ""), e.amount])); }
    });
    const wb = XLSX.utils.book_new();
    const add = (rows, name, w) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = w.map(x => ({ wch: x })); XLSX.utils.book_append_sheet(wb, ws, name); };
    add(per, "Per maand", [16, 11, 12, 10, 11, 9, 12, 10, 14, 18, 12]); add(fixedRows, "Vaste posten", [11, 24, 16, 9, 11, 10, 13, 10]);
    add(buys, "Aankopen", [12, 28, 10]); add(kl, "Klarna", [24, 10, 10, 14, 11]); add(pots, "Spaarpotjes", [24, 12, 22]); add(deps, "Stortingen", [24, 12, 14, 12, 10]);
    const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
    await giveFile(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `saldo-${today()}.xlsx`);
  }

      { kind: "uit", name: "Zorgverzekering", cat: "Verzekeringen", hist: [{ from: m2, amount: 152, freq: "maand" }] },

      { kind: "uit", name: "Telefoon en streaming", cat: "Abonnementen", hist: [{ from: m2, amount: 42, freq: "maand" }] },
      { kind: "uit", name: "Boodschappen", cat: "Boodschappen", hist: [{ from: m2, amount: 380, freq: "maand" }] },
      { kind: "buy", name: "Winterjas", amount: 129.95, date: d(m0, 2) },
      { kind: "buy", name: "Kapper", amount: 32, date: d(m0, 4) },
      { kind: "buy", name: "Verjaardagscadeau", amount: 45, date: d(m1, 12) },
      { kind: "kl", name: "Zalando", amount: 89.97, terms: 3, start: m1 },
      { kind: "kl", name: "Koptelefoon", amount: 199, terms: 1, start: m0 },
      { kind: "dep", potId: buffer.id, name: "Buffer", hist: [{ from: m2, amount: 200, freq: "maand" }] },

      { kind: "dep", potId: japan.id, name: "Japan", once: m0, amount: 100 },
    ].map(ex);
    S.items.push(...items);
    const byName = n => items.find(i => i.name === n).id;
    ["Salaris", "Zorgtoeslag", "Huur", "Energie", "Zorgverzekering", "Winterjas", "Kapper", "Buffer"].forEach(n => setPaid(m0, byName(n), true));
    S.balances[m0] = S.balances[m0] || { amount: 1240.35, at: Date.now() - 2 * 3600e3, example: true };
    S.balances[m1] = S.balances[m1] || { amount: 640.2, at: Date.now() - 25 * 864e5, example: true };
    S.ccs[m0] = S.ccs[m0] || { amount: 175.89, at: Date.now() - 26 * 3600e3, example: true };
    S.ccs[m1] = S.ccs[m1] || { amount: 412.6, at: Date.now() - 9 * 864e5, example: true };
    persist(); render();
  }
  function unseed() {
    const ids = new Set(S.items.filter(i => i.example).map(i => i.id));
    S.items = S.items.filter(i => !i.example);
    S.pots = S.pots.filter(p => !p.example);
    Object.keys(S.paid).forEach(m => ids.forEach(id => setPaid(m, id, false)));
    [S.balances, S.ccs].forEach(o => Object.keys(o).forEach(m => { if (o[m].example) delete o[m]; }));
    persist(); render();
  }

  applyTheme();
  if (PREVIEW && S.fresh) seed(); else render();
  if (!PREVIEW && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
