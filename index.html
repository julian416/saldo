<body>
<style>
/* Layout: één app-kolom. Bovenaan een donkere 'leren' kaart met de verwachting eind van de maand,
   daaronder een raster van 6 kolommen met glazen tegels (⅓, ½, ⅔ of vol breed, versleepbaar), zwevende tabbalk onderin. */
:root {
  --bg: #100E0C;
  --bg2: #191411;
  --ink: #F2EBE1;
  --muted: #A3998D;
  --faint: #6F675E;
  --glass: rgba(255, 244, 228, .055);
  --glass-hi: rgba(255, 244, 228, .10);
  --glass-line: rgba(255, 236, 214, .10);
  --sheet: rgba(30, 25, 21, .90);
  --field: rgba(255, 244, 228, .06);
  --accent: #C9A27A;
  --accent-ink: #17120E;
  --neg: #E3907A;
  --hero-a: #2C2219;
  --hero-b: #120E0B;
  --hero-ink: #F4ECE0;
  --hero-muted: #B3A595;
  --hero-line: rgba(214, 178, 134, .24);
  --hero-neg: #E9997F;
  --glow1: rgba(184, 124, 70, .40);
  --glow2: rgba(122, 46, 58, .28);
  --glow3: rgba(201, 162, 122, .14);
  --shadow: 0 14px 40px rgba(0, 0, 0, .38);
  --c-in: #D9C4A0; --c-uit: #9AA3AE; --c-buy: #D08A5A; --c-cc: #C2707E; --c-kl: #DDA3A8; --c-sav: #93B3A1;
  --cd-in: #D9C4A0; --cd-uit: #9AA3AE; --cd-buy: #D08A5A; --cd-cc: #C2707E; --cd-kl: #DDA3A8; --cd-sav: #93B3A1;
  --r: 12px;
  --r-sm: 8px;
  --f-display: "Hedvig Letters Serif", "Iowan Old Style", "Baskerville", "Times New Roman", serif;
  --f-body: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #EEE7DC; --bg2: #E5DACB; --ink: #1C1713; --muted: #6C6257; --faint: #9C9184;
    --glass: rgba(255, 252, 246, .56); --glass-hi: rgba(255, 252, 246, .80); --glass-line: rgba(70, 50, 30, .11);
    --sheet: rgba(250, 246, 239, .93); --field: rgba(60, 40, 20, .05);
    --accent: #8A5A33; --accent-ink: #FBF6EE; --neg: #A3402C;
    --glow1: rgba(201, 150, 100, .42); --glow2: rgba(160, 100, 107, .20); --glow3: rgba(255, 255, 255, .55);
    --shadow: 0 14px 34px rgba(80, 55, 30, .14);
    --c-in: #8C7656; --c-uit: #4D5560; --c-buy: #9A4F24; --c-cc: #7A2E3A; --c-kl: #A0646B; --c-sav: #4F6B5C;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #EEE7DC; --bg2: #E5DACB; --ink: #1C1713; --muted: #6C6257; --faint: #9C9184;
  --glass: rgba(255, 252, 246, .56); --glass-hi: rgba(255, 252, 246, .80); --glass-line: rgba(70, 50, 30, .11);
  --sheet: rgba(250, 246, 239, .93); --field: rgba(60, 40, 20, .05);
  --accent: #8A5A33; --accent-ink: #FBF6EE; --neg: #A3402C;
  --glow1: rgba(201, 150, 100, .42); --glow2: rgba(160, 100, 107, .20); --glow3: rgba(255, 255, 255, .55);
  --shadow: 0 14px 34px rgba(80, 55, 30, .14);
  --c-in: #8C7656; --c-uit: #4D5560; --c-buy: #9A4F24; --c-cc: #7A2E3A; --c-kl: #A0646B; --c-sav: #4F6B5C;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  font-weight: 400; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(112px + env(safe-area-inset-bottom, 0px));
}
.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(60% 42% at 8% 0%, var(--glow1), transparent 72%),
    radial-gradient(55% 40% at 100% 88%, var(--glow2), transparent 72%),
    radial-gradient(42% 30% at 88% 22%, var(--glow3), transparent 72%),
    linear-gradient(180deg, var(--bg), var(--bg2)); }
.grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: .16; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .45 0 0 0 0 .35 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.shell { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }
.glass { background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3); }

/* bedragen */
.m { white-space: nowrap; -webkit-text-stroke: var(--mstroke, .018em) currentColor; }
.m-c, .m-d { -webkit-text-stroke: .01em currentColor; }
.m-c { font-size: .56em; vertical-align: .52em; margin-right: .1em; opacity: .8; }
.m-d { font-size: .5em; vertical-align: .82em; margin-left: .03em; opacity: .8; }
.m-s { margin-right: .12em; }

/* bovenbalk */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 14px 6px; }
.appbar::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); z-index: -1; background: linear-gradient(var(--bg) 55%, transparent); }
html, body { overflow-x: clip; }
.brand { margin: 0; font-family: var(--f-display); font-weight: var(--dw, 400); font-size: 1.75rem; line-height: 1; letter-spacing: -.01em; }
.brand em { font-style: italic; color: var(--accent); }
.month { display: flex; align-items: center; gap: 2px; border-radius: 999px; padding: 2px; }
.month button { border: 0; background: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; color: var(--muted); }
.month button:active { background: var(--glass-hi); }
.month span { min-width: 7.6em; text-align: center; font-size: .85rem; color: var(--muted); }
.month span em { font-family: var(--f-display); font-weight: var(--dw, 400); font-style: var(--di, italic); font-size: 1.2rem; color: var(--ink); margin-right: 4px; }
.back { border: 0; background: none; color: var(--muted); font-size: .9rem; padding: 6px 0; display: flex; align-items: center; gap: 6px; }
.done-btn { border: 0; border-radius: 999px; padding: 8px 16px; background: var(--ink); color: var(--bg); font-weight: 500; font-size: .88rem; }

/* verwachting */
.hero { position: relative; overflow: hidden; border-radius: calc(var(--r) + 4px); padding: 22px 20px 18px; color: var(--hero-ink);
  background: radial-gradient(120% 90% at 0% 0%, rgba(201, 162, 122, .20), transparent 60%), radial-gradient(90% 80% at 100% 100%, rgba(122, 46, 58, .22), transparent 60%), linear-gradient(160deg, var(--hero-a), var(--hero-b));
  border: 1px solid var(--hero-line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
.h-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.h-eye { margin: 0; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--hero-muted); }
.h-eye em { font-family: var(--f-display); font-weight: var(--dw, 400); font-style: var(--di, italic); text-transform: none; letter-spacing: 0; font-size: 1.45rem; color: var(--hero-ink); margin-left: 4px; }
.h-now { border: 1px solid var(--hero-line); background: none; color: var(--hero-muted); border-radius: 999px; padding: 4px 10px; font-size: .75rem; }
.h-big { margin: -4px 0 0; font-family: var(--f-display); font-weight: var(--dw, 400); font-size: calc(clamp(3.4rem, 17vw, 5.6rem) * var(--ds, 1)); line-height: .95; letter-spacing: -.02em; }
.h-big.neg { color: var(--hero-neg); }
.h-stats { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--hero-line); padding-top: 12px; }
.h-stats div { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding-right: 8px; }
.h-stats div + div { border-left: 1px solid var(--hero-line); padding-left: 12px; }
.h-stats dt { font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--hero-muted); }
.h-stats dd { margin: 0; font-size: clamp(.78rem, 3.6vw, .92rem); font-weight: 500; white-space: nowrap; }
.h-prompt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--hero-line); padding-top: 12px; font-size: .86rem; color: var(--hero-muted); }
.bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: rgba(255, 240, 220, .1); gap: 2px; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 2px; }
.h-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.h-foot div { display: flex; flex-direction: column; gap: 2px; }
.h-foot div:last-child { text-align: right; }
.h-duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding-top: 2px; }
.h-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; container-type: inline-size; text-align: left; border: 0; background: none; color: inherit; padding: 0; }
.h-col + .h-col { border-left: 1px solid var(--hero-line); padding-left: 16px; }
.h-bal { padding-right: 14px; cursor: pointer; }
.h-bal:active .h-num { opacity: .7; }
.h-duo .h-l { min-height: 1.35rem; display: flex; align-items: baseline; gap: 5px; white-space: nowrap; font-size: .64rem; letter-spacing: .15em; text-transform: uppercase; color: var(--hero-muted); }
.h-duo .h-l em { font-family: var(--f-display); font-weight: var(--dw, 400); font-style: var(--di, italic); text-transform: none; letter-spacing: 0; font-size: 1.05rem; color: var(--hero-ink); }
.h-num { font-family: var(--f-display); font-weight: var(--dw, 400); font-size: clamp(1.9rem, 22.5cqi, 3.6rem); line-height: 1; letter-spacing: -.025em; margin-top: 2px; white-space: nowrap; }
.h-num.neg { color: var(--hero-neg); }
.h-sub { font-size: .7rem; color: var(--hero-muted); line-height: 1.4; }
.h-duo .h-l svg { width: 11px; height: 11px; align-self: center; opacity: .75; }
.h-foot .h-l { font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--hero-muted); }
.h-foot b { font-family: var(--f-display); font-weight: var(--dw, 400); font-size: 1.55rem; line-height: 1.05; }
.h-foot b.neg { color: var(--hero-neg); }

/* raster met tegels */
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 10px; }
.slot { grid-column: span var(--w, 2); min-width: 0; position: relative; }
.tile { position: relative; height: 100%; min-height: 116px; border-radius: var(--r); padding: 13px 13px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  container-type: inline-size; cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: background .15s; }
.tile:active { background: var(--glass-hi); }
.t-lbl { display: flex; align-items: center; gap: 7px; font-size: .64rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); font-weight: 500; line-height: 1.25; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
.t-amt { font-family: var(--f-display); font-weight: var(--dw, 400); font-size: calc(clamp(1.3rem, 15.5cqi, 2.5rem) * var(--ds, 1)); line-height: 1; letter-spacing: -.01em; }
.t-amt.neg { color: var(--neg); }
.t-sub { margin-top: 5px; font-size: .72rem; color: var(--muted); line-height: 1.3; }
.t-list { list-style: none; margin: 0; padding: 9px 0 0; border-top: 1px solid var(--glass-line); display: flex; flex-direction: column; gap: 6px; font-size: .76rem; }
.t-list li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.t-list .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.t-list .v { white-space: nowrap; font-variant-numeric: tabular-nums; }
.t-list li.done .n, .t-list li.done .v { opacity: .45; }
.t-list .ic { width: 14px; height: 14px; flex: none; color: var(--c-sav); }
.t-list .pb { width: 40px; height: 3px; border-radius: 2px; background: var(--glass-line); flex: none; overflow: hidden; }
.t-list .pb i { display: block; height: 100%; background: var(--c-sav); }
.t-list .more { color: var(--faint); }

/* bewerken van de indeling */
.edithint { font-size: .8rem; color: var(--muted); text-align: center; padding: 2px 8px; }
.sizer { position: absolute; top: 7px; right: 7px; z-index: 2; display: none; gap: 2px; padding: 2px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--glass-line); }
.sizer button { border: 0; background: none; width: 23px; height: 22px; border-radius: 999px; font-size: .72rem; color: var(--muted); padding: 0; }
.sizer button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
body.editing .sizer { display: flex; }
body.editing .tile { touch-action: none; }
@media (prefers-reduced-motion: no-preference) {
  body.editing .tile { animation: wig .28s ease-in-out infinite alternate; }
  body.editing .slot:nth-child(2n) .tile { animation-delay: -.14s; }
  body.editing .slot[style*="--w:6"] .tile, body.editing .slot[style*="--w:4"] .tile { animation-name: wig3; }
  @keyframes wig { from { transform: rotate(-.7deg); } to { transform: rotate(.7deg); } }
  @keyframes wig3 { from { transform: rotate(-.25deg); } to { transform: rotate(.25deg); } }
}
.slot.ph { border-radius: var(--r); outline: 1px dashed var(--faint); outline-offset: -1px; }
.slot.ph .tile { visibility: hidden; }
.ghost { position: fixed; z-index: 60; pointer-events: none; margin: 0; box-shadow: 0 22px 50px rgba(0, 0, 0, .45); transform: scale(1.04); animation: none !important; }
.ghost .sizer, .ghost .tile-hide { display: none !important; }
.tile-hide { position: absolute; top: -7px; left: -7px; z-index: 3; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--sheet); color: var(--ink); display: none; place-items: center; padding: 0; font-size: 1rem; line-height: 1; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
body.editing .tile-hide { display: grid; }
.editbar { display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px dashed var(--faint); background: none; border-radius: 999px; padding: 8px 13px; font-size: .84rem; color: var(--muted); }
.chip .dot { width: 6px; height: 6px; }
.t-prog { height: 3px; border-radius: 2px; background: var(--glass-line); overflow: hidden; margin-top: 8px; }
.t-prog i { display: block; height: 100%; border-radius: 2px; }
/* instellingen */
.sec { border-radius: var(--r); overflow: hidden; }
.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 16px; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary b { font-family: var(--f-display); font-weight: var(--dw, 400); font-size: 1.25rem; flex: 1; }
.sec > summary small { color: var(--muted); font-size: .8rem; text-align: right; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); margin: -4px 4px 0 0; transition: transform .2s; flex: none; }
.sec[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
.sec-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.srow { display: flex; align-items: center; gap: 12px; min-height: 44px; border-top: 1px solid var(--glass-line); padding-top: 10px; }
.sec-body > .srow:first-child { border-top: 0; padding-top: 0; }
.srow > label, .srow > .lbl { flex: 1; min-width: 0; font-size: .92rem; }
.srow .dot { width: 9px; height: 9px; }
.srow select, .pick { font: inherit; font-size: 16px; color: var(--ink); background-color: var(--field); border: 1px solid var(--glass-line); border-radius: 999px; padding: 8px 32px 8px 14px; min-height: 40px; -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.srow select option, .pick option { color: #1C1713; }
.srow.col { flex-direction: column; align-items: stretch; gap: 8px; }
.srow.col .lbl { display: flex; justify-content: space-between; }
.srow.col .lbl small { color: var(--muted); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--track, var(--glass-line)); border: 1px solid var(--glass-line); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--track, var(--glass-line)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--thumb, var(--ink)); border: 3px solid var(--ink); margin-top: -9px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--thumb, var(--ink)); border: 3px solid var(--ink); }
.hue { --track: linear-gradient(90deg, hsl(0 50% 45%), hsl(30 55% 45%), hsl(60 45% 42%), hsl(120 30% 40%), hsl(180 35% 38%), hsl(220 35% 45%), hsl(270 30% 45%), hsl(320 40% 45%), hsl(360 50% 45%)); }
.switch, .srow > label.switch { position: relative; width: 46px; height: 28px; flex: 0 0 46px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--glass-line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); background: var(--accent-ink); }
.switch input:focus-visible + span { outline: 1.5px solid var(--accent); outline-offset: 2px; }
.preview { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; padding: 14px; border-radius: var(--r); background: var(--bg); border: 1px solid var(--glass-line); }
.preview .tile { cursor: default; }

/* detailschermen */
.dhead { display: flex; flex-direction: column; gap: 6px; padding: 6px 2px 2px; }

    const f = FONTS.find(x => x[0] === S.set.font) || FONTS[0];
    root.style.setProperty("--f-display", `${f[2]}, "Iowan Old Style", "Baskerville", "Times New Roman", serif`);
    root.style.setProperty("--dw", f[3]); root.style.setProperty("--di", f[4]); root.style.setProperty("--ds", f[5]);
    // achtergrondgloed
    applyGlow(dark);
    const mt = document.querySelector('meta[name="theme-color"]');
    if (mt) mt.setAttribute("content", dark ? "#100E0C" : "#EEE7DC");
  }
  try { mq.addEventListener("change", () => { applyTheme(); render(); }); } catch (e) {}
  try { new MutationObserver(() => { if (S.set.theme === "auto" && !themeIsOurs) applyTheme(); }).observe(root, { attributes: true, attributeFilter: ["data-theme"] }); } catch (e) {}

  /* ---------- weergave ---------- */
  const app = document.getElementById("app");
  const appbar = document.getElementById("appbar");
  const appName = () => (S.set.name || "").trim() || "Saldo";
  let toastT;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600);
  }
  function go(view) { S.view = view; if (S.editing) S.editing = false; document.body.classList.remove("editing"); render(); window.scrollTo({ top: 0 }); }

  function render() {
    app.querySelectorAll("details[data-sec]").forEach(d => d.open ? S.openSec.add(d.dataset.sec) : S.openSec.delete(d.dataset.sec));
    const v = S.view;
    const monthNav = `<div class="month glass" aria-label="Maand kiezen"><button data-act="prev" aria-label="Vorige maand">‹</button><span class="num"><em>${esc(monthName(S.month, false))}</em>${S.month.slice(0, 4)}</span><button data-act="next" aria-label="Volgende maand">›</button></div>`;
    const brand = `<p class="brand" id="logoName">${esc(appName())}</p>`;
    if (v === "overview") appbar.innerHTML = brand + (S.editing ? `<button class="done-btn" data-act="edit-done">Klaar</button>` : monthNav);
    else if (v.startsWith("detail:")) appbar.innerHTML = `<button class="back" data-tab="overview">‹ Overzicht</button>${monthNav}`;
    else if (v.startsWith("pot:")) appbar.innerHTML = `<button class="back" data-tab="sav">‹ Sparen</button>${monthNav}`;
    else if (v === "sav") appbar.innerHTML = brand + monthNav;
    else appbar.innerHTML = brand;
    const tabOf = v === "sav" || v.startsWith("pot:") ? "sav" : v.startsWith("detail:") ? "overview" : v;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.tab === tabOf ? "page" : "false"));
    if (v === "overview") app.innerHTML = overview();
    else if (v.startsWith("detail:")) app.innerHTML = detail(v.slice(7));
    else if (v === "sav") app.innerHTML = savView();
    else if (v.startsWith("pot:")) app.innerHTML = potView(v.slice(4));
    else if (v === "history") app.innerHTML = history();
    else app.innerHTML = more();
  }

  function overview() {
    const c = calc(S.month), mN = monthName(S.month, false);
    let h = "";
    if (S.items.some(i => i.example) || S.pots.some(p => p.example)) h += `<div class="note glass"><span>Je ziet voorbeeldbedragen.</span><button class="btn small" data-act="unseed">Wis en begin zelf</button></div>`;
    h += hero(c, mN);
    if (S.editing) h += `<p class="edithint">Sleep een tegel naar een andere plek. Kies rechtsboven de breedte, of verberg hem met −.</p>`;
    h += `<div class="grid" id="grid">${gridHtml(c)}</div>`;
    if (S.editing) {
      const hid = S.set.layout.filter(t => t.hidden);
      h += `<div class="editbar">${hid.length ? `<p class="edithint" style="text-align:left;padding:0 2px">Verborgen tegels</p><div class="chips">${hid.map(t => `<button class="chip" data-unhide="${t.id}"><span class="dot" style="--c:${tileColor(t.id)}"></span>+ ${esc(tileName(t.id))}</button>`).join("")}</div>` : ""}
        <div class="btns"><button class="btn" data-act="new-tile">+ Eigen tegel</button></div></div>`;
    }
    return h;
  }

  function hero(c, mN) {
    const has = !!c.bal;
    const scale = Math.max(c.t.in, c.costs) || 1;
    const seg = (v, col) => v > 0 ? `<i style="width:${(v / scale * 100).toFixed(2)}%;--c:${col}"></i>` : "";
    const balSub = !has ? "Tik om in te vullen" : c.bal.month === S.month ? "Bijgewerkt " + esc(whenText(c.bal.at)) : "Laatste stand uit " + esc(monthName(c.bal.month, false));
    return `<section class="hero grain" aria-live="polite">
      ${S.month !== NOW ? `<div class="h-top"><p class="h-eye">${esc(monthName(S.month))}</p><button class="h-now" data-act="now">Naar nu</button></div>` : ""}
      <div class="h-duo">
        <button class="h-col h-bal" data-stand="bal" aria-label="Saldo bijwerken">
          <span class="h-l">Op rekening${S.set.balLock ? `<svg class="i" viewBox="0 0 24 24" aria-label="vastgezet"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>` : `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>`}</span>
          <span class="h-num ${has && c.bal.amount < 0 ? "neg" : ""}">${has ? money(c.bal.amount) : "—"}</span>
          <span class="h-sub">${balSub}</span>
        </button>
        <div class="h-col">
          <span class="h-l">${has ? "Eind" : "Over in"} <em>${esc(mN)}</em></span>
          <span class="h-num ${(has ? c.expected : c.over) < 0 ? "neg" : ""}">${money(has ? c.expected : c.over)}</span>
          <span class="h-sub num">${has ? `+&nbsp;${eur.format(c.inLeft)} binnen · −&nbsp;${eur.format(c.costLeft)} eraf` : "Vul je saldo in voor je verwachting"}</span>
        </div>
      </div>
      <div class="bar" role="img" aria-label="Je inkomen deze maand: vaste lasten ${eur.format(c.t.uit)}, aankopen ${eur.format(c.t.buy)}, creditcard ${eur.format(c.t.cc)}, Klarna ${eur.format(c.klLeft)}, sparen ${eur.format(c.t.sav)}, over ${eur.format(Math.max(0, c.over))}">
        ${seg(c.t.uit, "var(--cd-uit)")}${seg(c.t.buy, "var(--cd-buy)")}${seg(c.t.cc, "var(--cd-cc)")}${seg(c.klLeft, "var(--cd-kl)")}${seg(c.t.sav, "var(--cd-sav)")}${seg(c.over, "rgba(244,236,224,.75)")}</div>
      <div class="h-foot"><div><span class="h-l">Over deze maand</span><b class="${c.over < 0 ? "neg" : ""}">${money(c.over)}</b></div>
        <div><span class="h-l">Spaargeld eind ${esc(mN)}</span><b>${money(c.savTotal)}</b></div></div>
    </section>`;
  }

  function tileName(id) { const ct = S.set.custom.find(x => x.id === id); return ct ? ct.name : TILE_NAMES[id] || id; }
  function tileColor(id) { const ct = S.set.custom.find(x => x.id === id); return ct ? colorOf(ct.color) : `var(--c-${id})`; }
  const colorOf = id => isDark() ? pal(id)[3] : pal(id)[2];
  const hideBtn = id => `<button class="tile-hide" data-hide="${id}" aria-label="${esc(tileName(id))} verbergen">−</button>`;
  function gridHtml(c) {
    return S.set.layout.filter(t => !t.hidden).map(({ id, w }) =>
      `<div class="slot${drag && drag.id === id ? " ph" : ""}" data-tile="${id}" style="--w:${w}">${tileHtml(id, w, c)}</div>`).join("");
  }
  function sizer(id, w) {
    return `<div class="sizer" role="group" aria-label="Breedte">${WIDTHS.map(([n, l, a]) => `<button data-size="${id}:${n}" aria-pressed="${n === w}" aria-label="${a}">${l}</button>`).join("")}</div>`;
  }
  function sourceLabel(ct) {
    if (ct.src.startsWith("pot:")) { const p = S.pots.find(x => x.id === ct.src.slice(4)); return p ? "Spaarpotje " + p.name : "Spaarpotje"; }
    if (ct.src.startsWith("cat:")) return "Vaste lasten: " + ct.src.slice(4);
    const s = SOURCES.find(x => x[0] === ct.src); return s ? s[1] : "";
  }
  function klRest(m) {
    let t = 0;
    for (const it of S.items) {
      if (it.kind !== "kl") continue;
      const n = Number(it.terms) || 1, share = (Number(it.amount) || 0) / n;
      for (let k = 0; k < n; k++) { const mm = addMonths(it.start, k); if (mm < m) continue; if (mm === m && isPaid(m, it.id)) continue; t += share; }
    }
    return t;
  }
  function customValue(ct, c) {
    const src = ct.src;
    if (src === "manual") return Number(ct.value) || 0;
    if (src === "balance") return c.bal ? c.bal.amount : null;
    if (src === "expected") return c.expected;
    if (src === "over") return c.over;
    if (src === "inLeft") return c.inLeft;
    if (src === "costLeft") return c.costLeft;
    if (src === "savings") return c.savTotal;
    if (src === "ccOpen") return S.ccOpen;
    if (src === "klRest") return klRest(S.month);
    if (src === "perDay") {
      if (c.expected == null || S.month < NOW) return null;
      const [y, mo] = S.month.split("-").map(Number), dim = new Date(y, mo, 0).getDate();
      const left = S.month === NOW ? dim - new Date().getDate() + 1 : dim;
      return c.expected / Math.max(1, left);
    }
    if (src === "networth") {
      const own = S.set.custom.filter(x => x.src === "manual" && x.inNet).reduce((s, x) => s + (Number(x.value) || 0), 0);
      return (c.bal ? c.bal.amount : 0) + c.savTotal + own - Math.max(0, S.ccOpen) - klRest(S.month);
    }
    if (src.startsWith("pot:")) { const p = S.pots.find(x => x.id === src.slice(4)); return p ? potAt(p, S.month) : null; }
    if (src.startsWith("cat:")) return c.uit.filter(r => (r.it.cat || "Overig") === src.slice(4)).reduce((s, r) => s + r.v, 0);
    return null;
  }
  function customTile(ct, w, c, preview) {
    const v = customValue(ct, c), col = colorOf(ct.color);
    let sub = esc(sourceLabel(ct));
    if (ct.src === "manual" && ct.at) sub = "Bijgewerkt " + esc(whenText(ct.at));
    if (ct.src === "perDay" && v != null && S.month === NOW) { const [y, mo] = S.month.split("-").map(Number); const left = new Date(y, mo, 0).getDate() - new Date().getDate() + 1; sub = `Nog ${left} dag${left === 1 ? "" : "en"} deze maand`; }
    const prog = ct.goal && v != null ? `<div class="t-prog"><i style="width:${Math.max(0, Math.min(100, v / ct.goal * 100)).toFixed(1)}%;background:${col}"></i></div><div class="t-sub num">${Math.round(v / ct.goal * 100)}% van ${eur.format(ct.goal)}</div>` : "";
    return `<div class="tile glass" ${preview ? "" : `data-custom="${esc(ct.id)}"`}>${preview ? "" : sizer(ct.id, w) + hideBtn(ct.id)}
      <div class="t-lbl"><span class="dot" style="--c:${col}"></span>${esc(ct.name || "Eigen tegel")}</div>
      <div><div class="t-amt ${v != null && v < 0 ? "neg" : ""}">${v == null ? "—" : money(v)}</div><div class="t-sub">${sub}</div>${prog}</div></div>`;
  }
  function tileHtml(id, w, c) {
    const ct = S.set.custom.find(x => x.id === id);
    if (ct) return customTile(ct, w, c);
    const head = (label, col) => `<div class="t-lbl"><span class="dot" style="--c:${col}"></span>${label}</div>`;
    const n = w >= 6 ? 5 : w >= 4 ? 3 : w === 3 ? 2 : 0;
    const list = (rows, fmt) => n && rows.length ? `<ul class="t-list">${rows.slice(0, n).map(fmt).join("")}${rows.length > n ? `<li class="more">en nog ${rows.length - n}</li>` : ""}</ul>` : "";
    const rowLi = r => `<li class="${r.done ? "done" : ""}"><span class="n">${esc(r.it.name)}</span><span class="v">${eur.format(r.v)}</span></li>`;
    let inner;
    if (id === "bal") {
      inner = `${head("Rekening", "var(--ink)")}<div><div class="t-amt ${c.bal && c.bal.amount < 0 ? "neg" : ""}">${c.bal ? money(c.bal.amount) : "—"}</div>
        <div class="t-sub">${c.bal ? "Bijgewerkt " + esc(whenText(c.bal.at)) : "Tik om in te vullen"}</div></div>`;
      return `<div class="tile glass" data-stand="bal">${sizer(id, w)}${hideBtn(id)}${inner}</div>`;
    }
    if (id === "cc") {
      const lp = lastPay();
      const ev = S.ccLog.filter(e => e.month === S.month).sort((a, b) => (b.date + b.at).localeCompare(a.date + a.at));
      const sub = S.ccLog.length ? "Openstaand" + (lp ? ` · afgelost ${new Date(lp.date + "T12:00").toLocaleDateString("nl-NL", { day: "numeric", month: "short" })}` : "") : "Tik om je stand in te vullen";
      const li = e => `<li><span class="n">${esc(ccLabel(e))}</span><span class="v">${e.delta < 0 ? "−" : "+"} ${eur.format(Math.abs(e.delta))}</span></li>`;
      inner = `${head("Creditcard", "var(--c-cc)")}<div><div class="t-amt">${S.ccLog.length ? money(S.ccOpen) : "—"}</div><div class="t-sub">${sub}</div></div>${n && ev.length ? `<ul class="t-list">${ev.slice(0, n).map(li).join("")}${ev.length > n ? `<li class="more">en nog ${ev.length - n}</li>` : ""}</ul>` : ""}`;
      return `<div class="tile glass" data-open="cc">${sizer(id, w)}${hideBtn(id)}${inner}</div>`;
    }
    if (id === "sav") {
      const pots = S.pots.map(p => ({ p, v: potAt(p, S.month) }));
      const sub = c.t.sav ? `+ ${eur.format(c.t.sav)} inleg deze maand` : S.pots.length ? `${S.pots.length} potje${S.pots.length === 1 ? "" : "s"}` : "Tik om een potje te maken";
      const li = x => `<li><span class="ic">${icon(x.p.icon)}</span><span class="n">${esc(x.p.name)}</span>${w >= 4 && x.p.goal ? `<span class="pb"><i style="width:${Math.min(100, x.v / x.p.goal * 100).toFixed(1)}%"></i></span>` : ""}<span class="v">${eur.format(x.v)}</span></li>`;
      inner = `${head("Sparen", "var(--c-sav)")}<div><div class="t-amt">${money(c.savTotal)}</div><div class="t-sub">${sub}</div></div>${n && pots.length ? `<ul class="t-list">${pots.slice(0, n).map(li).join("")}${pots.length > n ? `<li class="more">en nog ${pots.length - n}</li>` : ""}</ul>` : ""}`;
      return `<div class="tile glass" data-go="sav">${sizer(id, w)}${hideBtn(id)}${inner}</div>`;
    }
    const b = BLOCKS[id], rows = c[id], total = c.t[id] + (id === "buy" ? c.t.buyPot + c.t.buyCC : 0);
    const done = rows.filter(r => r.done).length;
    const sub = (rows.length ? `${done} van ${rows.length} ${b.verb.toLowerCase()}` : id === "buy" ? "Nog geen aankopen" : id === "kl" ? "Geen termijnen" : "Nog niets ingevuld")
      + (id === "buy" && c.t.buyCC ? ` · ${eur.format(c.t.buyCC)} creditcard` : "") + (id === "buy" && c.t.buyPot ? ` · ${eur.format(c.t.buyPot)} uit potjes` : "");
    inner = `${head(b.title, b.c)}<div><div class="t-amt">${money(total)}</div><div class="t-sub">${sub}</div></div>${list(rows, rowLi)}`;
    return `<div class="tile glass" data-open="${id}">${sizer(id, w)}${hideBtn(id)}${inner}</div>`;
  }

  function checkRow(r, verb, meta, amtHtml) {
    return `<div class="row ${r.done ? "done" : ""}"><button class="chk" data-paid="${esc(r.it.id)}" aria-pressed="${r.done}" aria-label="${verb}: ${esc(r.it.name)}" title="${verb}">${CHECK}</button>
      <button class="row-main" data-edit="${esc(r.it.id)}"><span class="txt"><span class="name">${esc(r.it.name)}${r.it.example ? '<span class="tag">voorbeeld</span>' : ""}</span><span class="meta num">${meta}</span></span>
      <span class="amt">${amtHtml}</span></button></div>`;
  }

  function ccLabel(e) {
    if (e.kind === "pay") return "Afgelost";
    if (e.kind === "kl") return "Klarna · " + (e.name || "termijn") + (e.delta < 0 ? " (teruggedraaid)" : "");
    if (e.kind === "buy") return "Aankoop · " + (e.name || "");
    return "Stand bijgewerkt";
  }
  function ccView() {
    const mN = monthName(S.month, false);
    const ev = S.ccLog.filter(e => e.month === S.month).sort((a, b) => (b.date + b.at).localeCompare(a.date + a.at));
    const rows = ev.map(e => {
      const d = new Date(e.date + "T12:00").toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
      const meta = e.kind === "pay" ? `Van je rekening · ${d}` : e.kind === "kl" ? `Termijn afgevinkt · ${d}` : e.kind === "buy" ? `Met je creditcard betaald · ${d}` : `Nieuwe stand ${eur.format(e.amount)} · ${d}`;
      const inner = `<span class="txt"><span class="name">${esc(ccLabel(e))}</span><span class="meta num">${meta}</span></span><span class="amt">${e.delta < 0 ? "−" : "+"} ${eur.format(Math.abs(e.delta))}</span>`;
      return `<div class="row">${e.kind === "pay" ? `<button class="row-main solo" data-ccpay="${esc(e.id)}">${inner}</button>` : `<div class="row-main solo">${inner}</div>`}</div>`;
    }).join("");
    return `<div class="dhead"><h1><span class="dot" style="--c:var(--c-cc)"></span>Creditcard</h1></div>
      <section class="panel glass cc-card"><p class="eyebrow-s">Openstaand</p><div class="cc-big num">${money(S.ccOpen)}</div>
        <div class="cc-two num"><div><span>Uitgegeven in ${esc(mN)}</span>${eur.format(ccSpend(S.month))}</div><div><span>Afgelost in ${esc(mN)}</span>${eur.format(ccPaidIn(S.month))}</div></div>
        <div class="btns"><button class="btn primary" data-act="cc-pay" ${S.ccOpen > 0 ? "" : "disabled"}>Aflossen</button><button class="btn" data-act="cc-set">Stand bijwerken</button></div></section>
      <h2 class="h2">${esc(mN.charAt(0).toUpperCase() + mN.slice(1))}</h2>
      <div class="list glass">${rows || `<div class="empty-row">Nog niets in ${esc(mN)}.</div>`}</div>`;
  }

  function detail(k) {
    if (k === "cc") return ccView();
    const b = BLOCKS[k]; if (!b) return overview();
    const c = calc(S.month), rows = c[k], mN = monthName(S.month, false);
    const done = rows.filter(r => r.done).length;
    const rowHtml = rows.map(r => {
      const it = r.it; let meta, tag = "";
      if (b.fixed) {
        const hst = histOf(it);
        if (hst[0].from === S.month) tag = " · nieuw"; else if (r.e.from === S.month) tag = " · gewijzigd";
        meta = (it.cat ? esc(it.cat) + " · " : "") + (r.e.freq === "maand" ? "per maand" : `${eur.format(r.e.amount)} ${FREQ_LABEL[r.e.freq]}`) + tag +
          (it.until ? ` · t/m ${esc(shortMonth(addMonths(it.until, -1)))}` : "");
      } else if (k === "buy") meta = new Date(it.date + "T12:00").toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" }) + (r.pot ? ` · uit potje ${esc(r.pot.name)}` : it.via === "cc" ? " · creditcard" : "");
      else meta = r.k.of === 1 ? "In één keer" : `Termijn ${r.k.nr} van ${r.k.of} · totaal ${eur.format(it.amount)}`;
      return checkRow(r, b.verb, meta, `${k === "in" ? "+" : "−"} ${eur.format(r.v)}`);
    }).join("");
    const explain = b.fixed ? "Gaat elke maand vanzelf mee. Vink af wat al " + (k === "in" ? "binnen is." : "is afgeschreven.")
      : k === "buy" ? "Losse uitgaven deze maand. Vink af wat al van je rekening is." : "Termijnen worden automatisch over de maanden verdeeld.";
    return `<div class="dhead"><h1><span class="dot" style="--c:${b.c}"></span>${b.title}</h1>
      <p class="num"><span class="tot">${money(c.t[k] + (k === "buy" ? c.t.buyPot + c.t.buyCC : 0))}</span> in ${esc(mN)}${rows.length ? ` · ${done} van ${rows.length} ${b.verb.toLowerCase()}` : ""}</p></div>
      <div class="list glass">${rowHtml || `<div class="empty-row">Niets in ${esc(mN)}.</div>`}<button class="add" data-add="${k}">+ ${esc(b.add)}</button></div>`;
  }

  function potLine(p, c) {
    const deps = c.dep.filter(d => d.pot.id === p.id), inleg = deps.reduce((s, d) => s + d.v, 0), v = potAt(p, S.month);
    const opn = c.buyPot.filter(x => x.pot.id === p.id).reduce((s, x) => s + x.v, 0);
    const parts = [];
    if (inleg) parts.push(`+ ${eur.format(inleg)} deze maand`);
    if (opn) parts.push(`− ${eur.format(opn)} opgenomen`);
    if (p.goal) parts.push(`${Math.round(v / p.goal * 100)}% van ${eur.format(p.goal)}`);
    return { v, sub: parts.join(" · ") || "Geen inleg deze maand" };
  }
  function savView() {
    const c = calc(S.month), mN = monthName(S.month, false);
    const cards = S.pots.map(p => {
      const l = potLine(p, c);
      return `<button class="pot glass" data-pot="${esc(p.id)}"><span class="p-ic">${icon(p.icon)}</span><span class="p-name">${esc(p.name)}</span>
        <span class="p-sub num">${l.sub}</span><span class="p-amt num">${money(l.v)}</span>
        ${p.goal ? `<span class="prog"><i style="width:${Math.min(100, l.v / p.goal * 100).toFixed(1)}%"></i></span>` : ""}</button>`;
    }).join("");
    return `<div class="dhead"><h1><span class="dot" style="--c:var(--c-sav)"></span>Sparen</h1>
      <p class="num"><span class="tot">${money(c.savTotal)}</span> verwacht eind ${esc(mN)}</p>
      ${S.pots.length ? "" : `<p class="hint">Maak potjes voor je spaardoelen en stel in wat je elke maand inlegt.</p>`}</div>
      <div class="pots">${cards || `<div class="panel glass"><p class="hint">Nog geen potjes. Begin bijvoorbeeld met een buffer of een reis.</p></div>`}</div>
      <div class="btns"><button class="btn primary" data-act="new-pot">+ Nieuw potje</button></div>`;
  }

  function history() {
    const first = firstMonth();
    if (!first) return `<h1 class="h2">Maanden</h1><section class="panel glass"><p class="hint">Zodra je bedragen invult, zie je hier per maand wat er binnenkwam, wat eraf ging en wat je overhield.</p></section>`;
    const last = S.month > NOW ? S.month : NOW, months = [];
    for (let m = last; m >= first && months.length < 36; m = addMonths(m, -1)) months.push(m);
    const rows = months.map(m => {

  const hueName = h => ["Rood", "Oranje", "Amber", "Geel", "Olijf", "Groen", "Groen", "Zeegroen", "Petrol", "Blauw", "Blauw", "Indigo", "Paars", "Pruim", "Roze", "Bordeaux", "Rood"][Math.round(h / 22.5) % 17];

        <div class="field"><label for="set-name">Naam bovenin</label><input id="set-name" maxlength="20" autocomplete="off" value="${esc(S.set.name)}" placeholder="Saldo"></div></div></details>
