        ${colorRows}<button class="link" data-act="reset-colors">Standaardkleuren terugzetten</button></div></details>
      <details class="sec glass" data-sec="bg" ${open("bg")}><summary><b>Achtergrond</b><small id="bg-sum">${hueName(S.set.bg.h1)} en ${hueName(S.set.bg.h2).toLowerCase()}</small></summary><div class="sec-body">
        <div class="srow col"><span class="lbl"><label for="bg-h1">Gloed linksboven</label><small id="bg-h1-n">${hueName(S.set.bg.h1)}</small></span><input type="range" class="hue" id="bg-h1" min="0" max="360" step="1" value="${S.set.bg.h1}" data-bgrange="h1" style="--thumb:hsl(${S.set.bg.h1} 50% 45%)"></div>
        <div class="srow col"><span class="lbl"><label for="bg-h2">Gloed rechtsonder</label><small id="bg-h2-n">${hueName(S.set.bg.h2)}</small></span><input type="range" class="hue" id="bg-h2" min="0" max="360" step="1" value="${S.set.bg.h2}" data-bgrange="h2" style="--thumb:hsl(${S.set.bg.h2} 50% 45%)"></div>
        <div class="srow col"><span class="lbl"><label for="bg-s">Sterkte</label><small id="bg-s-n">${S.set.bg.strength}%</small></span><input type="range" id="bg-s" min="0" max="100" step="1" value="${S.set.bg.strength}" data-bgrange="strength" style="--track:linear-gradient(90deg, var(--glass-line), var(--accent))"></div>
        <button class="link" data-act="reset-bg">Standaard achtergrond terugzetten</button></div></details>
      <details class="sec glass" data-sec="tiles" ${open("tiles")}><summary><b>Tegels</b><small>${shown} van ${S.set.layout.length} zichtbaar</small></summary><div class="sec-body">
        ${tiles}
        <div class="btns"><button class="btn primary" data-act="new-tile">+ Eigen tegel</button><button class="btn" data-act="edit-layout">Indeling aanpassen</button><button class="btn" data-act="reset-layout">Standaard indeling</button></div></div></details>
      <details class="sec glass" data-sec="data" ${open("data")}><summary><b>Back-up en Excel</b><small>${S.lastBackup ? "Laatste " + esc(new Date(S.lastBackup).toLocaleDateString("nl-NL", { day: "numeric", month: "short" })) : "Nog geen back-up"}</small></summary><div class="sec-body">
        <p class="hint">Alles staat alleen op dit toestel. ${S.lastBackup ? "Laatste back-up: " + esc(niceDate(S.lastBackup)) + "." : "Er is nog geen back-up gemaakt."}</p>
        <div class="btns"><button class="btn primary" data-act="backup">Back-up maken</button><button class="btn" data-act="excel">Download als Excel</button><button class="btn" data-act="restore">Back-up terugzetten</button></div>${restore}</div></details>
      <details class="sec glass" data-sec="ex" ${open("ex")}><summary><b>Voorbeelden</b><small>${hasEx ? "Aan" : "Uit"}</small></summary><div class="sec-body">
        <div class="btns">${hasEx ? `<button class="btn" data-act="unseed">Voorbeelden wissen</button>` : `<button class="btn" data-act="seed">Voorbeelden laden</button>`}</div></div></details>`;
  }

  /* ---------- eigen tegels ---------- */
  function openCustom(ct) {
    const isEdit = !!ct;
    const draft = isEdit ? { ...ct } : { id: "c_" + newId().replace(/-/g, "").slice(0, 10), name: "", color: "brons", src: "perDay", goal: null, value: 0, at: null, inNet: false };
    const lay = isEdit ? S.set.layout.find(t => t.id === ct.id) : null;
    let w = lay ? lay.w : 3;
    const opts = SOURCES.map(([v, l]) => `<option value="${v}" ${draft.src === v ? "selected" : ""}>${l}</option>`).join("")
      + (S.pots.length ? `<optgroup label="Spaarpotje">${S.pots.map(p => `<option value="pot:${esc(p.id)}" ${draft.src === "pot:" + p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</optgroup>` : "")
      + `<optgroup label="Vaste lasten per soort">${CATS.map(k => `<option value="cat:${esc(k)}" ${draft.src === "cat:" + k ? "selected" : ""}>${esc(k)}</option>`).join("")}</optgroup>`;
    mount(`<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate>
      <h2 id="sh-t">${isEdit ? "Tegel aanpassen" : "Eigen tegel"}</h2>
      <div class="preview" id="cp-prev"></div>
      <div class="field"><label for="cp-name">Naam</label><input id="cp-name" maxlength="40" autocomplete="off" placeholder="Bijv. Per dag, Beleggingen, Wonen" value="${esc(draft.name)}"></div>
      <div class="field"><label for="cp-src">Wat laat de tegel zien?</label><select id="cp-src" class="pick" style="border-radius:var(--r-sm)">${opts}</select><p class="hint" id="cp-src-h"></p></div>
      <div id="cp-man">${amountField("cp-val", "Bedrag", isEdit && draft.src === "manual" ? draft.value : "")}
        <button type="button" class="toggle" id="cp-net" aria-pressed="${draft.inNet}" style="margin-top:10px"><span class="chk" style="width:30px;padding:0" aria-pressed="${draft.inNet}">${CHECK}</span>Telt mee in mijn vermogen</button></div>
      <div class="srow" style="border:0;padding:0"><label for="cp-col">Kleur</label><select id="cp-col">${PALETTE.map(([id, nm]) => `<option value="${id}" ${id === draft.color ? "selected" : ""}>${nm}</option>`).join("")}</select></div>
      <div class="srow" style="border:0;padding:0"><label for="cp-w">Breedte</label><select id="cp-w">${WIDTHS.map(([n, l, a]) => `<option value="${n}" ${n === w ? "selected" : ""}>${a} (${l})</option>`).join("")}</select></div>
      ${amountField("cp-goal", "Doel (mag leeg)", draft.goal || "")}
      ${footer(isEdit)}</form>`, isEdit ? null : "cp-name");
    const read = () => {
      draft.name = $("cp-name").value.trim() || (sourceLabel({ src: $("cp-src").value }) || "Eigen tegel");
      draft.src = $("cp-src").value; draft.color = $("cp-col").value; w = Number($("cp-w").value);
      const g = parseAmount($("cp-goal").value); draft.goal = g > 0 ? g : null;
      if (draft.src === "manual") { const v = parseAmount($("cp-val").value, true); draft.value = isNaN(v) ? 0 : v; }
    };
    const upd = () => {
      read();
      $("cp-man").hidden = draft.src !== "manual";
      const sdef = SOURCES.find(x => x[0] === draft.src); $("cp-src-h").textContent = sdef ? sdef[2] : "";
      const show = { ...draft, at: draft.src === "manual" ? Date.now() : null };
      $("cp-prev").innerHTML = `<div class="slot" style="--w:${w}">${customTile(show, w, calc(S.month), true)}</div>`;
    };
    upd();
    host.querySelectorAll("input, select").forEach(el => { el.addEventListener("input", upd); el.addEventListener("change", upd); });
    $("cp-net").onclick = () => { draft.inNet = !draft.inNet; $("cp-net").setAttribute("aria-pressed", draft.inNet); $("cp-net").querySelector(".chk").setAttribute("aria-pressed", draft.inNet); };
    if (isEdit) $("f-del").onclick = () => {
      confirmDelete(`<p>“${esc(ct.name)}” verwijderen?</p><div class="btns"><button type="button" class="btn danger solid" id="f-del-yes">Tegel verwijderen</button></div>`);
      $("f-del-yes").onclick = () => { S.set.custom = S.set.custom.filter(x => x.id !== ct.id); S.set.layout = S.set.layout.filter(t => t.id !== ct.id); persist(); closeSheet(); render(); toast("Tegel verwijderd"); };
    };
    $("sheet").addEventListener("submit", e => {
      e.preventDefault(); read();
      if (draft.src === "manual" && isNaN(parseAmount($("cp-val").value, true)) && $("cp-val").value.trim()) return showErr("Vul een bedrag in, bijvoorbeeld 2.500.", "cp-val");
      const prevVal = isEdit ? ct.value : null;
      const out = { id: draft.id, name: draft.name, color: draft.color, src: draft.src, goal: draft.goal, value: draft.value, inNet: draft.inNet,
        at: draft.src === "manual" ? (isEdit && prevVal === draft.value && ct.at ? ct.at : Date.now()) : null };
      if (isEdit) { Object.assign(ct, out); const l = S.set.layout.find(t => t.id === ct.id); if (l) { l.w = w; l.hidden = false; } }
      else { S.set.custom.push(out); S.set.layout.push({ id: out.id, w, hidden: false }); }
      persist(); closeSheet(); render(); toast(isEdit ? "Tegel opgeslagen" : "Tegel toegevoegd aan je overzicht");
    });
  }

  /* ---------- tegels verschuiven ---------- */
  let press = null, drag = null, suppressClick = false, scrollRAF = 0;
  function setEditing(v) { S.editing = v; document.body.classList.toggle("editing", v); render(); }
  function renderGridAnimated() {
    const grid = document.getElementById("grid"); if (!grid) return;
    const before = {};
    grid.querySelectorAll(".slot").forEach(el => before[el.dataset.tile] = el.getBoundingClientRect());
    grid.innerHTML = gridHtml(calc(S.month));
    if (reduced()) return;
    grid.querySelectorAll(".slot").forEach(el => {
      const b = before[el.dataset.tile]; if (!b) return;
      const a = el.getBoundingClientRect(), dx = b.left - a.left, dy = b.top - a.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 240, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }
  function startDrag(id, x, y) {
    const slot = document.querySelector(`.slot[data-tile="${id}"]`); if (!slot) return;
    const rect = slot.getBoundingClientRect();
    const ghost = slot.querySelector(".tile").cloneNode(true);
    ghost.classList.add("ghost");
    Object.assign(ghost.style, { left: rect.left + "px", top: rect.top + "px", width: rect.width + "px", height: rect.height + "px" });
    document.body.appendChild(ghost);
    slot.classList.add("ph");
    drag = { id, ghost, ox: x - rect.left, oy: y - rect.top, x, y, last: null };
    scrollLoop();
  }
  function moveDrag(x, y) {
    drag.x = x; drag.y = y;
    drag.ghost.style.left = (x - drag.ox) + "px";
    drag.ghost.style.top = (y - drag.oy) + "px";
    // na een verschuiving even rust, zodat tegels niet doorspringen
    if (drag.lock && (Date.now() < drag.lock.t || Math.hypot(x - drag.lock.x, y - drag.lock.y) < 24)) return;
    let target = null;
    document.querySelectorAll("#grid .slot").forEach(el => {
      if (el.dataset.tile === drag.id) return;
      const r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) target = el.dataset.tile;
    });
    if (target && target !== drag.last) {
      const L = S.set.layout, from = L.findIndex(t => t.id === drag.id), to = L.findIndex(t => t.id === target);
      const [it] = L.splice(from, 1); L.splice(to, 0, it);
      renderGridAnimated();
      drag.lock = { t: Date.now() + 280, x, y };
    }
    drag.last = target;
  }
  function scrollLoop() {
    cancelAnimationFrame(scrollRAF);
    const step = () => {
      if (!drag) return;
      const edge = 90, h = window.innerHeight;
      if (drag.y < edge) window.scrollBy(0, -Math.ceil((edge - drag.y) / 8));
      else if (drag.y > h - edge - 40) window.scrollBy(0, Math.ceil((drag.y - (h - edge - 40)) / 8));
      scrollRAF = requestAnimationFrame(step);
    };
    scrollRAF = requestAnimationFrame(step);
  }
  function endDrag() {
    const d = drag; drag = null; cancelAnimationFrame(scrollRAF);
    const slot = document.querySelector(`.slot[data-tile="${d.id}"]`);
    const finish = () => { d.ghost.remove(); if (slot) slot.classList.remove("ph"); };
    if (slot && !reduced()) {
      const r = slot.getBoundingClientRect();
      const a = d.ghost.animate([{ left: d.ghost.style.left, top: d.ghost.style.top, transform: "scale(1.04)" }, { left: r.left + "px", top: r.top + "px", transform: "scale(1)" }], { duration: 180, easing: "ease-out", fill: "forwards" });
      a.onfinish = finish;
    } else finish();
    persist();
    setTimeout(() => { suppressClick = false; }, 80);
  }
  document.addEventListener("pointerdown", e => {
    if (S.view !== "overview" || e.button > 0) return;
    const slot = e.target.closest("#grid .slot"); if (!slot || e.target.closest(".sizer, .tile-hide")) return;
    const id = slot.dataset.tile;
    if (S.editing) { e.preventDefault(); suppressClick = true; startDrag(id, e.clientX, e.clientY); return; }
    press = { id, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY };
    press.timer = setTimeout(() => {
      const p = press; press = null; if (!p) return;
      suppressClick = true;
      setEditing(true);
      startDrag(p.id, p.lx, p.ly);
    }, 450);
  });
  document.addEventListener("pointermove", e => {
    if (press) { press.lx = e.clientX; press.ly = e.clientY; if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 9) { clearTimeout(press.timer); press = null; } }
    if (drag) moveDrag(e.clientX, e.clientY);
  });
  const endPress = () => { if (press) { clearTimeout(press.timer); press = null; } if (drag) endDrag(); };
  document.addEventListener("pointerup", endPress);
  document.addEventListener("pointercancel", endPress);
  document.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", e => { if (e.target.closest(".slot")) e.preventDefault(); });

  /* ---------- klikken ---------- */
  document.addEventListener("click", e => {
    if (e.target.closest("#sheetHost")) return;
    if (suppressClick) { suppressClick = false; return; }
    const t = e.target;
    const sz = t.closest("[data-size]");
    if (sz) { const [id, w] = sz.dataset.size.split(":"); const it = S.set.layout.find(x => x.id === id); if (it) { it.w = Number(w); persist(); renderGridAnimated(); } return; }
    const hd = t.closest("[data-hide]");
    if (hd) { const l = S.set.layout.find(x => x.id === hd.dataset.hide); if (l) { l.hidden = true; persist(); render(); toast(`${tileName(l.id)} verborgen`); } return; }
    const uh = t.closest("[data-unhide]");
    if (uh) { const l = S.set.layout.find(x => x.id === uh.dataset.unhide); if (l) { l.hidden = false; persist(); render(); } return; }
    if (t.closest("[data-act='new-tile']")) return openCustom();
    if (S.editing && S.view === "overview") {
      if (t.closest("[data-act='edit-done']") || !t.closest(".slot")) { setEditing(false); }
      return;
    }
    const cu = t.closest("[data-custom]"); if (cu) { const ct = S.set.custom.find(x => x.id === cu.dataset.custom); if (ct) openCustom(ct); return; }
    const tab = t.closest("[data-tab]"); if (tab) return go(tab.dataset.tab);
    if (t.closest("#tabAdd")) return openChooser();
    const pd = t.closest("[data-paid]");
    if (pd) { togglePaid(pd.dataset.paid); return; }
    const st = t.closest("[data-stand]"); if (st) return openStand(st.dataset.stand);
    const cp = t.closest("[data-ccpay]"); if (cp) { const e = S.ccLog.find(x => x.id === cp.dataset.ccpay); if (e) openPay(e); return; }
    const ad = t.closest("[data-add]"); if (ad) return openSheet(ad.dataset.add);
    const ed = t.closest("[data-edit]");
    if (ed) { const it = S.items.find(i => i.id === ed.dataset.edit); if (it) it.kind === "dep" ? openDeposit({ item: it }) : openSheet(it.kind, it); return; }
    const op = t.closest("[data-open]"); if (op) return go("detail:" + op.dataset.open);
    const g = t.closest("[data-go]"); if (g) return go(g.dataset.go);
    const pt = t.closest("[data-pot]"); if (pt) return go("pot:" + pt.dataset.pot);
    const pb = t.closest("[data-pot-bal]"); if (pb) return openPotBalance(pb.dataset.potBal);
    const pe = t.closest("[data-pot-edit]"); if (pe) return openPot(S.pots.find(p => p.id === pe.dataset.potEdit));
    const dp = t.closest("[data-dep]"); if (dp) return openDeposit({ potId: dp.dataset.dep });
    const hm = t.closest("[data-month]"); if (hm) { S.month = hm.dataset.month; return go("overview"); }
    const fo = t.closest("[data-font]");
    if (fo) { S.set.font = fo.dataset.font; persist(); applyTheme(); render(); return; }
    const sw = t.closest("[data-color]");
    if (sw) { const [k, id] = sw.dataset.color.split(":"); S.set.colors[k] = id; persist(); applyTheme(); render(); return; }
    const a = t.closest("[data-act]"); if (!a) return;
    switch (a.dataset.act) {
      case "prev": S.month = addMonths(S.month, -1); render(); break;
      case "next": S.month = addMonths(S.month, 1); render(); break;
      case "now": S.month = NOW; render(); break;
      case "new-pot": openPot(); break;
      case "cc-pay": openPay(); break;
      case "cc-set": openStand("cc"); break;
      case "edit-layout": S.view = "overview"; setEditing(true); window.scrollTo({ top: 0 }); break;
      case "reset-layout": S.set.layout = normLayout([], true, S.set.custom.map(x => x.id)); persist(); render(); toast("Standaard indeling terug"); break;
      case "reset-bg": S.set.bg = Object.assign({}, DEFAULT_BG); persist(); applyTheme(); render(); toast("Standaard achtergrond terug"); break;
      case "reset-colors": S.set.colors = Object.assign({}, DEFAULT_COLORS); persist(); applyTheme(); render(); toast("Standaardkleuren terug"); break;
      case "seed": seed(); toast("Voorbeelden geladen"); break;
      case "unseed": unseed(); toast("Voorbeelden gewist"); break;
      case "backup": backup(); break;
      case "excel": exportXlsx(a); break;
      case "restore": if (PREVIEW) return toast("Terugzetten werkt in de echte app op je telefoon."); document.getElementById("restoreInput").click(); break;
      case "restore-no": S.pendingRestore = null; render(); break;
      case "restore-yes": {
        const d = S.pendingRestore.data; S.pendingRestore = null;
        Object.assign(S, { items: d.items, balances: d.balances, ccOpen: d.ccOpen, ccLog: d.ccLog, pots: d.pots, paid: d.paid, set: d.set });
        S.month = NOW; persist(); applyTheme(); go("overview"); toast("Back-up teruggezet"); break;
      }
    }
  });
  document.addEventListener("change", e => {
    if (e.target.name === "theme") { S.set.theme = e.target.value; persist(); applyTheme(); render(); }
    if (e.target.dataset.colsel) { S.set.colors[e.target.dataset.colsel] = e.target.value; persist(); applyTheme(); render(); }
    if (e.target.dataset.vis) { const l = S.set.layout.find(x => x.id === e.target.dataset.vis); if (l) { l.hidden = !e.target.checked; persist(); render(); } }
    if (e.target.dataset.bgrange) persist();
  });
  document.addEventListener("toggle", e => {
    const d = e.target; if (!d.matches || !d.matches("details[data-sec]")) return;
    if (d.open) S.openSec.add(d.dataset.sec); else S.openSec.delete(d.dataset.sec);
  }, true);
  document.addEventListener("input", e => {
    const br = e.target.dataset && e.target.dataset.bgrange;
    if (br) {
      const v = Number(e.target.value); S.set.bg[br] = v; applyGlow();
      if (br === "strength") { const n = $("bg-s-n"); if (n) n.textContent = v + "%"; }
      else {
        e.target.style.setProperty("--thumb", `hsl(${v} 50% 45%)`);
        const n = $(`bg-${br}-n`); if (n) n.textContent = hueName(v);
        const sm = $("bg-sum"); if (sm) sm.textContent = `${hueName(S.set.bg.h1)} en ${hueName(S.set.bg.h2).toLowerCase()}`;
      }
    }
    if (e.target.id === "set-name") { S.set.name = e.target.value; persist(); const l = document.getElementById("logoName"); if (l) l.textContent = appName(); }
  });

  /* ---------- panelen ---------- */
  const host = document.getElementById("sheetHost");
  let lastFocus = null;
  const $ = id => document.getElementById(id);
  function mount(html, focusId) {
    lastFocus = document.activeElement;
    host.innerHTML = `<div class="scrim" id="scrim">${html}</div>`;
    $("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
    const cancel = $("f-cancel"); if (cancel) cancel.onclick = closeSheet;
    if (focusId) setTimeout(() => { const f = $(focusId); if (f) f.focus(); }, 40);
  }
  function closeSheet() { host.innerHTML = ""; if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus(); }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && host.firstChild) closeSheet(); });
  function showErr(msg, focusId) { const el = $("f-err"); if (!el) return; el.textContent = msg; el.hidden = false; if (focusId && $(focusId)) $(focusId).focus(); }
  const amountField = (id, label, val) => `<div class="field"><label for="${id}">${label}</label><div class="amount-wrap"><span>€</span>
      <input id="${id}" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${val != null && val !== "" ? esc(String(val).replace(".", ",")) : ""}"></div></div>`;
  const footer = (del, delLabel) => `<p class="err" id="f-err" hidden></p><div id="f-confirm"></div>
      <div class="btns">${del ? `<button type="button" class="btn danger" id="f-del">${delLabel || "Verwijderen"}</button>` : ""}
      <div class="right"><button type="button" class="btn" id="f-cancel">Annuleren</button><button type="submit" class="btn primary">Opslaan</button></div></div>`;

  function openChooser() {
    const opt = (k, title, sub, c) => `<button type="button" data-pick="${k}"><b><span class="dot" style="--c:${c}"></span>${title}</b><small>${sub}</small></button>`;
    mount(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><h2 id="sh-t">Wat wil je toevoegen?</h2>
      <div class="choose">${opt("buy", "Aankoop", "Pinbetaling of losse uitgave", "var(--c-buy)")}${opt("dep", "Storting", "Naar een spaarpotje", "var(--c-sav)")}
      ${opt("cc", "Creditcard", "Stand of aflossen", "var(--c-cc)")}${opt("kl", "Klarna", "Aankoop of termijnen", "var(--c-kl)")}
      ${opt("uit", "Vaste last", "Elke maand", "var(--c-uit)")}${opt("in", "Inkomen", "Elke maand", "var(--c-in)")}
      ${opt("bal", "Saldo", "Stand lopende rekening", "var(--ink)")}${opt("pot", "Spaarpotje", "Nieuw spaardoel", "var(--c-sav)")}</div>
      <div class="btns"><div class="right"><button type="button" class="btn" id="f-cancel">Annuleren</button></div></div></div>`);
    host.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
      const k = b.dataset.pick; closeSheet();
      if (k === "bal") openStand(k);
      else if (k === "cc") go("detail:cc");
      else if (k === "dep") S.pots.length ? openDeposit({}) : (toast("Maak eerst een spaarpotje"), openPot());
      else if (k === "pot") openPot();
      else openSheet(k);
    });
  }

  function openStand(type) {
    const isCC = type === "cc", cur = isCC ? null : balAt(S.month);
    const val = isCC ? (S.ccLog.length ? S.ccOpen : "") : (cur ? cur.amount : "");
    mount(`<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate>
      <h2 id="sh-t"><span class="dot" style="--c:${isCC ? "var(--c-cc)" : "var(--ink)"}"></span>${isCC ? "Stand creditcard" : "Lopende rekening"}</h2>
      ${amountField("f-amt", isCC ? "Wat staat er nu open op je creditcard?" : "Wat staat er nu op je rekening?", val)}
      <p class="hint">${isCC ? "Kijk in je creditcard-app. Het verschil met de vorige stand telt als uitgave in " + esc(monthName(S.month, false)) + "." : esc(monthName(S.month)) + (cur ? " · vorige stand " + esc(whenText(cur.at)) : "") + ". Rood staan? Zet er een min voor."}</p>
      ${isCC ? "" : `<div class="srow" style="border-top:1px solid var(--glass-line);padding-top:12px"><span class="lbl">Saldo vastzetten<small class="hint" style="display:block;margin-top:2px" id="f-lock-h">${S.set.balLock ? "Vinkjes en aflossingen veranderen je saldo niet. Alleen jij past het aan." : "Vinkjes en aflossingen passen je saldo vanzelf aan."}</small></span>
        <label class="switch" aria-label="Saldo vastzetten"><input type="checkbox" id="f-lock" ${S.set.balLock ? "checked" : ""}><span></span></label></div>`}
      ${footer(false)}</form>`, "f-amt");
    if (!isCC) $("f-lock").onchange = e => {
      S.set.balLock = e.target.checked; persist(); render();
      $("f-lock-h").textContent = S.set.balLock ? "Vinkjes en aflossingen veranderen je saldo niet. Alleen jij past het aan." : "Vinkjes en aflossingen passen je saldo vanzelf aan.";
    };
    $("sheet").addEventListener("submit", e => {
      e.preventDefault();
      const v = parseAmount($("f-amt").value, !isCC);
      if (isNaN(v)) return showErr("Vul een bedrag in, bijvoorbeeld 1.250,00.", "f-amt");
      if (isCC) { const d = r2(v - S.ccOpen); if (d || !S.ccLog.length) ccAdd("set", d, { amount: v }); }
      else S.balances[S.month] = { ...(S.balances[S.month] || {}), amount: v, at: Date.now() };
      persist(); closeSheet(); render(); toast(isCC ? "Stand bijgewerkt" : "Saldo bijgewerkt");
    });
  }

  function openPay(existing) {
    if (existing) {
      mount(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><h2 id="sh-t"><span class="dot" style="--c:var(--c-cc)"></span>Aflossing</h2>
        <p class="num">${eur.format(existing.amount)} op ${esc(new Date(existing.date + "T12:00").toLocaleDateString("nl-NL", { day: "numeric", month: "long" }))}</p>
        <div class="confirm"><p>Deze aflossing verwijderen?</p><p class="hint">Het bedrag komt weer open te staan op je creditcard en terug op je saldo.</p>
          <div class="btns"><button type="button" class="btn danger solid" id="f-del-yes">Verwijderen</button></div></div>
        <div class="btns"><div class="right"><button type="button" class="btn" id="f-cancel">Sluiten</button></div></div></div>`);
      $("f-del-yes").onclick = () => { ccRemove(existing); adjustBalance(existing.month, existing.amount); persist(); closeSheet(); render(); toast("Aflossing verwijderd"); };
      return;
    }
    const open = Math.max(0, S.ccOpen);
    const prevSpend = r2(ccSpend(addMonths(S.month, -1)));
    const prevName = monthName(addMonths(S.month, -1), false);
    const defDate = S.month === ym(new Date()) ? today() : S.month + "-01";
    mount(`<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate>
      <h2 id="sh-t"><span class="dot" style="--c:var(--c-cc)"></span>Aflossen</h2>
      ${amountField("f-amt", "Bedrag", open || "")}
      <div class="quick"><button type="button" class="btn small" data-q="${open}">Alles · ${eur.format(open)}</button>${prevSpend > 0 && prevSpend < open ? `<button type="button" class="btn small" data-q="${prevSpend}">${esc(prevName.charAt(0).toUpperCase() + prevName.slice(1))} · ${eur.format(prevSpend)}</button>` : ""}</div>
      <div class="field"><label for="f-date">Datum</label><input type="date" id="f-date" value="${defDate}"></div>
      <p class="hint">Gaat van je saldo af en van het openstaande bedrag op je creditcard.</p>
      <p class="err" id="f-err" hidden></p>
      <div class="btns"><div class="right"><button type="button" class="btn" id="f-cancel">Annuleren</button><button type="submit" class="btn primary">Aflossen</button></div></div></form>`, "f-amt");
    host.querySelectorAll("[data-q]").forEach(bt => bt.onclick = () => { $("f-amt").value = String(bt.dataset.q).replace(".", ","); });
    $("sheet").addEventListener("submit", e => {
      e.preventDefault();
      const v = parseAmount($("f-amt").value), date = $("f-date").value || defDate;
      if (!(v > 0)) return showErr("Vul een bedrag in, bijvoorbeeld 412,60.", "f-amt");
      const m = date.slice(0, 7);
      ccAdd("pay", -v, { amount: v, date, month: m });
      const ok = adjustBalance(m, -v);
      persist(); closeSheet(); render();
      toast(ok === "locked" ? `${eur.format(v)} afgelost. Je saldo staat vast; werk het bij als het van je rekening is.` : ok ? `${eur.format(v)} afgelost` : `${eur.format(v)} afgelost. Vul je saldo in, dan gaat het er ook vanaf.`);
    });
  }

  function confirmDelete(html) { const c = $("f-confirm"); c.className = "confirm"; c.innerHTML = html; }

  function openSheet(kind, item) {
    const b = BLOCKS[kind]; if (!b) return;
    const isEdit = !!item, fixed = b.fixed, mName = monthName(S.month);
    const ph = { in: "Bijv. salaris", uit: "Bijv. huur", buy: "Bijv. nieuwe schoenen", kl: "Bijv. Zalando" };
    const cur = fixed && item ? (entryAt(item, S.month) || histOf(item).slice(-1)[0]) : null;
    const amount = fixed ? cur?.amount : item?.amount;
    const freq = cur?.freq || "maand", cat = item?.cat || "Wonen";
    const defDate = item?.date || (S.month === NOW ? today() : S.month + "-01");
    let extra = "";
    if (fixed) extra = `<fieldset class="field"><legend>Hoe vaak</legend><div class="seg">
        ${["maand", "kwartaal", "jaar"].map(f => `<input type="radio" name="freq" id="f-freq-${f}" value="${f}" ${f === freq ? "checked" : ""}><label for="f-freq-${f}">Per ${f}</label>`).join("")}</div><p class="hint" id="f-hint"></p></fieldset>
        <div class="field"><label for="f-from">${isEdit ? "Nieuw bedrag geldt vanaf" : "Geldt vanaf"}</label><input type="month" id="f-from" value="${S.month}" placeholder="2026-11">
        <p class="hint">${isEdit ? "Maanden daarvoor houden het oude bedrag." : "Gaat daarna elke maand vanzelf mee."}</p></div>
        ${kind === "uit" ? `<div class="field"><label for="f-cat">Soort</label><select id="f-cat">${CATS.map(k => `<option ${k === cat ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></div>` : ""}`;
    if (kind === "buy") extra = `<div class="field"><label for="f-date">Datum</label><input type="date" id="f-date" value="${esc(defDate)}"></div>
        <div class="field"><label for="f-from-acc">Betaald van</label><select id="f-from-acc"><option value="">Lopende rekening</option><option value="cc" ${item && item.via === "cc" ? "selected" : ""}>Creditcard</option>${S.pots.map(p => `<option value="${esc(p.id)}" ${item && item.fromPot === p.id ? "selected" : ""}>Spaarpotje: ${esc(p.name)}</option>`).join("")}</select>
        <p class="hint" id="f-from-h"></p></div>`;
    if (kind === "kl") extra = `<div class="field"><label for="f-terms">Betalen</label><select id="f-terms">${KL_TERMS.map(([n, l]) => `<option value="${n}" ${n === Number(item?.terms || 3) ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="field"><label for="f-start">Eerste betaling in</label><input type="month" id="f-start" value="${esc(item?.start || S.month)}" placeholder="2026-11"><p class="hint" id="f-hint"></p></div>`;
    mount(`<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate>
      <h2 id="sh-t"><span class="dot" style="--c:${b.c}"></span>${isEdit ? esc(item.name) : b.add}</h2>
      <div class="field"><label for="f-name">Omschrijving</label><input id="f-name" maxlength="60" autocomplete="off" placeholder="${ph[kind]}" value="${esc(item?.name || "")}"></div>
      ${amountField("f-amount", kind === "kl" ? "Totaalbedrag" : "Bedrag", amount)}
      ${extra}${footer(isEdit, fixed ? "Stoppen of verwijderen" : "Verwijderen")}</form>`, isEdit ? "f-amount" : "f-name");
    const hint = () => {
      const fh = $("f-from-h"); if (fh) { const fv = $("f-from-acc").value; fh.textContent = fv === "cc" ? "Komt op je openstaande creditcard. Je saldo verandert pas als je aflost." : fv ? "Gaat van je potje af. Je rekening en je verwachting blijven gelijk." : ""; }
      const h = $("f-hint"); if (!h) return;
      const a = parseAmount($("f-amount").value);
      if (kind === "kl") { const n = Number($("f-terms").value), s = $("f-start").value; h.textContent = a > 0 && n > 1 && isMonth(s) ? `${eur.format(a / n)} per maand, van ${monthName(s)} t/m ${monthName(addMonths(s, n - 1))}.` : ""; }
      else { const f = (document.querySelector('input[name="freq"]:checked') || {}).value; h.textContent = f && f !== "maand" && a > 0 ? `Telt mee als ${eur.format(a / FREQ[f])} per maand.` : ""; }
    };
    hint();
    host.querySelectorAll("input, select").forEach(el => { el.addEventListener("input", hint); el.addEventListener("change", hint); });
    if (isEdit) $("f-del").onclick = () => {
      confirmDelete(fixed ? `<p>Wat wil je met “${esc(item.name)}”?</p><p class="hint">Stoppen houdt de post in eerdere maanden, zodat je geschiedenis klopt.</p>
          <div class="btns"><button type="button" class="btn danger solid" id="f-stop">Stoppen vanaf ${esc(mName)}</button><button type="button" class="btn danger" id="f-del-yes">Overal verwijderen</button></div>`
        : `<p>“${esc(item.name)}” verwijderen?</p><div class="btns"><button type="button" class="btn danger solid" id="f-del-yes">Verwijderen</button></div>`);
      $("f-del-yes").onclick = () => { removeItem(item.id); closeSheet(); toast("Verwijderd"); };
      if ($("f-stop")) $("f-stop").onclick = () => { if (histOf(item)[0].from >= S.month) removeItem(item.id); else upsert({ ...item, until: S.month }); closeSheet(); toast(`Gestopt vanaf ${mName}`); };
    };
    $("sheet").addEventListener("submit", e => {
      e.preventDefault();
      const name = $("f-name").value.trim(), amt = parseAmount($("f-amount").value);
      if (!name) return showErr("Vul een omschrijving in.", "f-name");
      if (!(amt > 0)) return showErr("Vul een bedrag in, bijvoorbeeld 49,95.", "f-amount");
      const base = { id: isEdit ? item.id : newId(), kind, name, updatedAt: Date.now() };
      if (isEdit && item.example) base.example = true;
      let data;
      if (fixed) {
        const from = $("f-from").value.trim();
        if (!isMonth(from)) return showErr("Kies een maand, bijvoorbeeld 2026-11.", "f-from");
        const f = (document.querySelector('input[name="freq"]:checked') || {}).value || "maand";
        let hist = isEdit ? histOf(item) : [];
        const prev = isEdit ? entryAt({ ...item, until: null }, from) : null;
        if (!prev || prev.amount !== amt || prev.freq !== f) hist = hist.filter(h => h.from !== from).concat({ from, amount: amt, freq: f }).sort((a, b) => a.from.localeCompare(b.from));
        data = { ...base, hist };
        if (kind === "uit") data.cat = $("f-cat").value;
        if (isEdit && item.until && item.until > from) data.until = item.until;
        if (!isEdit && from > S.month) S.month = from;
      } else if (kind === "buy") {
        data = { ...base, amount: amt, date: $("f-date").value || today() };
        const fp = $("f-from-acc").value; if (fp === "cc") data.via = "cc"; else if (fp) data.fromPot = fp;
        if (!data.date.startsWith(S.month)) S.month = data.date.slice(0, 7);
      } else {
        const start = $("f-start").value.trim();
        if (!isMonth(start)) return showErr("Kies de maand van de eerste betaling.", "f-start");
        data = { ...base, amount: amt, terms: Number($("f-terms").value) || 1, start };
      }
      upsert(data); closeSheet(); toast(isEdit ? "Opgeslagen" : "Toegevoegd");
    });
  }

  function openPot(pot) {
    const isEdit = !!pot;
    let chosen = pot?.icon || "buffer";
    mount(`<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate>
      <h2 id="sh-t">${isEdit ? "Potje bewerken" : "Nieuw spaarpotje"}</h2>
      <div class="field"><label for="f-name">Naam</label><input id="f-name" maxlength="40" autocomplete="off" placeholder="Bijv. Buffer, Japan, Nieuwe auto" value="${esc(pot?.name || "")}"></div>
      <div class="field"><span class="hint" style="font-size:.7rem;letter-spacing:.12em;text-transform:uppercase">Icoon</span>
        <div class="icons" role="radiogroup" aria-label="Icoon">${Object.keys(ICONS).map(k => `<button type="button" role="radio" aria-checked="${k === chosen}" data-icon="${k}" aria-label="${ICON_NAMES[k]}" title="${ICON_NAMES[k]}">${icon(k)}</button>`).join("")}</div></div>
      ${amountField("f-goal", "Spaardoel (mag leeg)", pot?.goal || "")}
      ${isEdit ? "" : amountField("f-start", "Wat staat er nu al in?", "")}
      ${isEdit ? "" : `<p class="hint">Daarna kun je een vaste maandelijkse storting instellen.</p>`}
      ${footer(isEdit)}</form>`, isEdit ? null : "f-name");
    host.querySelectorAll("[data-icon]").forEach(bt => bt.onclick = () => {
      chosen = bt.dataset.icon; host.querySelectorAll("[data-icon]").forEach(x => x.setAttribute("aria-checked", x.dataset.icon === chosen));
    });
    if (isEdit) $("f-del").onclick = () => {
      confirmDelete(`<p>“${esc(pot.name)}” verwijderen?</p><p class="hint">Ook de stortingen naar dit potje verdwijnen, ook uit eerdere maanden.</p><div class="btns"><button type="button" class="btn danger solid" id="f-del-yes">Potje verwijderen</button></div>`);
      $("f-del-yes").onclick = () => {
        S.pots = S.pots.filter(p => p.id !== pot.id);
        S.items.filter(i => i.kind === "dep" && i.potId === pot.id).forEach(i => Object.keys(S.paid).forEach(m => setPaid(m, i.id, false)));
        S.items = S.items.filter(i => !(i.kind === "dep" && i.potId === pot.id));
        S.items.forEach(i => { if (i.fromPot === pot.id) delete i.fromPot; });
        persist(); closeSheet(); go("sav"); toast("Potje verwijderd");
      };
    };
    $("sheet").addEventListener("submit", e => {
      e.preventDefault();
      const name = $("f-name").value.trim();
      if (!name) return showErr("Geef je potje een naam.", "f-name");
      const gs = $("f-goal").value.trim(), goal = gs ? parseAmount(gs) : null;
      if (gs && !(goal > 0)) return showErr("Vul een doel in, bijvoorbeeld 5.000, of laat het leeg.", "f-goal");
      if (isEdit) { Object.assign(pot, { name, icon: chosen, goal }); persist(); closeSheet(); render(); toast("Opgeslagen"); return; }
      const ss = $("f-start").value.trim(), start = ss ? parseAmount(ss) : 0;
      if (ss && isNaN(start)) return showErr("Vul een bedrag in, bijvoorbeeld 1.000.", "f-start");
      const p = { id: newId(), name, icon: chosen, goal, snaps: {} };
      if (ss) p.snaps[S.month] = { amount: start, at: Date.now() };
      S.pots.push(p); persist(); closeSheet(); go("pot:" + p.id); toast("Potje gemaakt");
    });
  }

  function openPotBalance(id) {
    const p = S.pots.find(x => x.id === id); if (!p) return;
    const cur = p.snaps[S.month];
    const pending = S.items.some(i => i.kind === "dep" && i.potId === p.id && depAt(i, S.month) > 0 && !isPaid(S.month, i.id));
    mount(`<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate>
      <h2 id="sh-t"><span class="p-ic" style="width:34px;height:34px">${icon(p.icon)}</span>${esc(p.name)}</h2>
      ${amountField("f-amt", "Wat staat er nu in dit potje?", cur ? cur.amount : "")}
      <p class="hint">${pending ? "Is de storting van deze maand al overgemaakt en zit hij in dit bedrag? Vink hem dan af bij de stortingen, anders telt hij dubbel." : "Je stortingen van komende maanden komen hier automatisch bij."}</p>
      ${footer(false)}</form>`, "f-amt");
    $("sheet").addEventListener("submit", e => {
      e.preventDefault();
      const v = parseAmount($("f-amt").value);
      if (isNaN(v)) return showErr("Vul een bedrag in, bijvoorbeeld 2.500.", "f-amt");
      p.snaps[S.month] = { amount: v, at: Date.now() }; persist(); closeSheet(); render(); toast("Bedrag bijgewerkt");
    });
  }

  function openDeposit({ potId, item }) {
    const isEdit = !!item, mName = monthName(S.month);
    potId = potId || item?.potId || (S.pots[0] && S.pots[0].id);
    const recurring = isEdit ? !item.once : true;
    const cur = isEdit && !item.once ? (entryAt(item, S.month) || histOf(item).slice(-1)[0]) : null;
    const amount = isEdit ? (item.once ? item.amount : cur.amount) : "";
    mount(`<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate>
      <h2 id="sh-t"><span class="dot" style="--c:var(--c-sav)"></span>${isEdit ? "Storting bewerken" : "Storting"}</h2>
      <div class="field"><label for="f-pot">Naar potje</label><select id="f-pot">${S.pots.map(p => `<option value="${esc(p.id)}" ${p.id === potId ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>
      ${amountField("f-amount", "Bedrag", amount)}
      <fieldset class="field"><legend>Hoe vaak</legend><div class="seg">
        <input type="radio" name="rep" id="f-rep-m" value="m" ${recurring ? "checked" : ""}><label for="f-rep-m">Elke maand</label>
        <input type="radio" name="rep" id="f-rep-o" value="o" ${recurring ? "" : "checked"}><label for="f-rep-o">Eenmalig</label></div></fieldset>
      <div class="field"><label for="f-from" id="f-from-l">Vanaf</label><input type="month" id="f-from" value="${esc(isEdit && item.once ? item.once : S.month)}" placeholder="2026-11"></div>
      <p class="hint">De storting gaat van je inkomen af en komt in je potje.</p>
      ${footer(isEdit, recurring ? "Stoppen of verwijderen" : "Verwijderen")}</form>`, "f-amount");
    const sync = () => { $("f-from-l").textContent = $("f-rep-m").checked ? (isEdit ? "Nieuw bedrag geldt vanaf" : "Vanaf") : "In maand"; };
    sync(); $("f-rep-m").onchange = sync; $("f-rep-o").onchange = sync;
    if (isEdit) $("f-del").onclick = () => {
      confirmDelete(!item.once ? `<p>Wat wil je met deze storting?</p><p class="hint">Stoppen houdt eerdere stortingen in je potje.</p>
          <div class="btns"><button type="button" class="btn danger solid" id="f-stop">Stoppen vanaf ${esc(mName)}</button><button type="button" class="btn danger" id="f-del-yes">Overal verwijderen</button></div>`
        : `<p>Deze storting verwijderen?</p><div class="btns"><button type="button" class="btn danger solid" id="f-del-yes">Verwijderen</button></div>`);
      $("f-del-yes").onclick = () => { removeItem(item.id); closeSheet(); toast("Verwijderd"); };
      if ($("f-stop")) $("f-stop").onclick = () => { if (histOf(item)[0].from >= S.month) removeItem(item.id); else upsert({ ...item, until: S.month }); closeSheet(); toast(`Gestopt vanaf ${mName}`); };
    };
    $("sheet").addEventListener("submit", e => {
      e.preventDefault();
      const pid = $("f-pot").value, amt = parseAmount($("f-amount").value), from = $("f-from").value.trim(), rep = $("f-rep-m").checked;
      if (!(amt > 0)) return showErr("Vul een bedrag in, bijvoorbeeld 150.", "f-amount");
      if (!isMonth(from)) return showErr("Kies een maand, bijvoorbeeld 2026-11.", "f-from");
      const pot = S.pots.find(p => p.id === pid);
      const base = { id: isEdit ? item.id : newId(), kind: "dep", potId: pid, name: pot ? pot.name : "Storting", updatedAt: Date.now() };
      if (isEdit && item.example) base.example = true;
      let data;
      if (rep) {
        let hist = isEdit && !item.once ? histOf(item) : [];
        const prev = isEdit && !item.once ? entryAt({ ...item, until: null }, from) : null;
        if (!prev || prev.amount !== amt) hist = hist.filter(h => h.from !== from).concat({ from, amount: amt, freq: "maand" }).sort((a, b) => a.from.localeCompare(b.from));
        data = { ...base, hist };
        if (isEdit && item.until && item.until > from) data.until = item.until;
      } else data = { ...base, once: from, amount: amt };
      upsert(data); closeSheet(); toast(isEdit ? "Opgeslagen" : "Storting toegevoegd");
    });
  }

  /* ---------- back-up en Excel ---------- */
  async function giveFile(blob, filename) {
    try {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; }
    } catch (e) { if (e && e.name === "AbortError") return false; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return true;
  }
  async function backup() {
    if (PREVIEW) return toast("Back-ups maken werkt in de echte app op je telefoon.");
    const payload = JSON.stringify({ app: "saldo", v: 2, date: Date.now(), items: S.items, balances: S.balances, ccOpen: S.ccOpen, ccLog: S.ccLog, pots: S.pots, paid: S.paid, set: S.set }, null, 1);
    if (await giveFile(new Blob([payload], { type: "application/json" }), `saldo-backup-${today()}.json`)) { S.lastBackup = Date.now(); persist(); render(); toast("Back-up gemaakt"); }
  }
  document.getElementById("restoreInput").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d || d.app !== "saldo" || !Array.isArray(d.items)) throw 0;
        S.pendingRestore = { data: normalize(d), date: d.date || null }; render();
      } catch (err) { toast("Dit bestand is geen back-up van " + appName() + "."); }
    };
    rd.readAsText(f);
  });
  let xlsxP = null;
  const loadXlsx = () => window.XLSX ? Promise.resolve() : (xlsxP = xlsxP || new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "xlsx.full.min.js"; s.onload = res; s.onerror = () => { xlsxP = null; rej(); }; document.head.appendChild(s);
  }));
  if (!PREVIEW) setTimeout(() => loadXlsx().catch(() => {}), 1500);
  async function exportXlsx(btn) {
    if (PREVIEW) return toast("Excel downloaden werkt in de echte app op je telefoon.");
    if (!window.XLSX) { btn.disabled = true; try { await loadXlsx(); toast("Klaar. Tik nog een keer op Download als Excel."); } catch (e) { toast("Het Excel-onderdeel kon niet laden. Probeer het met internet opnieuw."); } btn.disabled = false; return; }
    const first = firstMonth() || NOW, months = [];
    for (let m = first; m <= NOW; m = addMonths(m, 1)) months.push(m);
    const per = [["Maand", "Inkomsten", "Vaste lasten", "Aankopen", "Creditcard", "Klarna", "Inleg sparen", "Over", "Saldo rekening", "Verwacht eind maand", "Spaargeld"]]
      .concat(months.map(m => { const c = calc(m); return [monthName(m), r2(c.t.in), r2(c.t.uit), r2(c.t.buy), r2(c.t.cc), r2(c.t.kl), r2(c.t.sav), r2(c.over), c.bal ? c.bal.amount : "", c.expected != null ? r2(c.expected) : "", r2(c.savTotal)]; }));
    const fixedRows = [["Soort", "Omschrijving", "Categorie", "Vanaf", "Tot en met", "Bedrag", "Hoe vaak", "Per maand"]];
    S.items.filter(i => i.kind === "in" || i.kind === "uit").forEach(it => {
      const h = histOf(it);
      h.forEach((e, k) => fixedRows.push([it.kind === "in" ? "Inkomen" : "Vaste last", it.name, it.cat || "", e.from === "0000-01" ? "" : e.from,
        k < h.length - 1 ? addMonths(h[k + 1].from, -1) : (it.until ? addMonths(it.until, -1) : ""), e.amount, FREQ_LABEL[e.freq], r2(monthly(e))]));
    });
    const buys = [["Datum", "Omschrijving", "Bedrag", "Betaald van"]].concat(S.items.filter(i => i.kind === "buy").sort((a, b) => a.date.localeCompare(b.date))
      .map(i => [i.date, i.name, i.amount, i.via === "cc" ? "Creditcard" : i.fromPot ? "Spaarpotje " + ((S.pots.find(p => p.id === i.fromPot) || {}).name || "") : "Lopende rekening"]));
    const kl = [["Omschrijving", "Totaal", "Termijnen", "Eerste betaling", "Per termijn"]].concat(S.items.filter(i => i.kind === "kl").map(i => [i.name, i.amount, i.terms, i.start, r2(i.amount / i.terms)]));
    const pots = [["Potje", "Doel", "Verwacht eind " + monthName(NOW)]].concat(S.pots.map(p => [p.name, p.goal || "", r2(potAt(p, NOW))]));
    const ccRows = [["Datum", "Soort", "Bedrag", "Effect op openstaand"]].concat(S.ccLog.slice().sort((a, b) => (a.date + a.at).localeCompare(b.date + b.at))
      .map(e => [e.date, ccLabel(e), e.kind === "kl" ? Math.abs(e.delta) : e.amount, e.delta]));
    const deps = [["Potje", "Soort", "Vanaf / maand", "Tot en met", "Bedrag"]];
    S.items.filter(i => i.kind === "dep").forEach(it => {
      const pn = (S.pots.find(p => p.id === it.potId) || {}).name || "";
      if (it.once) deps.push([pn, "Eenmalig", it.once, "", it.amount]);
      else { const h = histOf(it); h.forEach((e, k) => deps.push([pn, "Elke maand", e.from, k < h.length - 1 ? addMonths(h[k + 1].from, -1) : (it.until ? addMonths(it.until, -1) : ""), e.amount])); }
    });
    const wb = XLSX.utils.book_new();
    const add = (rows, name, w) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = w.map(x => ({ wch: x })); XLSX.utils.book_append_sheet(wb, ws, name); };
    add(per, "Per maand", [16, 11, 12, 10, 11, 9, 12, 10, 14, 18, 12]); add(fixedRows, "Vaste posten", [11, 24, 16, 9, 11, 10, 13, 10]);
    add(buys, "Aankopen", [12, 28, 10, 22]); add(ccRows, "Creditcard", [12, 26, 10, 20]); add(kl, "Klarna", [24, 10, 10, 14, 11]); add(pots, "Spaarpotjes", [24, 12, 22]); add(deps, "Stortingen", [24, 12, 14, 12, 10]);
    const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
    await giveFile(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `saldo-${today()}.xlsx`);
  }

  /* ---------- voorbeelden ---------- */
  function seed() {
    const m0 = S.month, m1 = addMonths(m0, -1), m2 = addMonths(m0, -2);
    const d = (m, day) => m + "-" + pad(day);
    const ex = r => ({ ...r, id: newId(), example: true, updatedAt: Date.now() });
    const buffer = { id: newId(), example: true, name: "Buffer", icon: "buffer", goal: 6000, snaps: { [m0]: { amount: 4350, at: Date.now() - 3 * 864e5 } } };
    const japan = { id: newId(), example: true, name: "Japan", icon: "reizen", goal: 3500, snaps: { [m1]: { amount: 1250, at: Date.now() - 30 * 864e5 } } };
    const auto = { id: newId(), example: true, name: "Nieuwe auto", icon: "auto", goal: 12000, snaps: { [m0]: { amount: 2800, at: Date.now() - 6 * 864e5 } } };
    S.pots.push(buffer, japan, auto);
    const items = [
      { kind: "in", name: "Salaris", hist: [{ from: m2, amount: 2850, freq: "maand" }] },
      { kind: "in", name: "Zorgtoeslag", hist: [{ from: m2, amount: 123, freq: "maand" }] },
      { kind: "uit", name: "Huur", cat: "Wonen", hist: [{ from: m2, amount: 1150, freq: "maand" }] },
      { kind: "uit", name: "Energie", cat: "Energie & water", hist: [{ from: m2, amount: 130, freq: "maand" }, { from: m0, amount: 145, freq: "maand" }] },
      { kind: "uit", name: "Zorgverzekering", cat: "Verzekeringen", hist: [{ from: m2, amount: 152, freq: "maand" }] },
      { kind: "uit", name: "Inboedelverzekering", cat: "Verzekeringen", hist: [{ from: m2, amount: 96, freq: "jaar" }] },
      { kind: "uit", name: "Telefoon en streaming", cat: "Abonnementen", hist: [{ from: m2, amount: 42, freq: "maand" }] },
      { kind: "uit", name: "Boodschappen", cat: "Boodschappen", hist: [{ from: m2, amount: 380, freq: "maand" }] },
      { kind: "buy", name: "Winterjas", amount: 129.95, date: d(m0, 2) },
      { kind: "buy", name: "Kapper", amount: 32, date: d(m0, 4) },
      { kind: "buy", name: "Verjaardagscadeau", amount: 45, date: d(m1, 12) },
      { kind: "kl", name: "Zalando", amount: 89.97, terms: 3, start: m1 },
      { kind: "kl", name: "Koptelefoon", amount: 199, terms: 1, start: m0 },
      { kind: "dep", potId: buffer.id, name: "Buffer", hist: [{ from: m2, amount: 200, freq: "maand" }] },
      { kind: "dep", potId: japan.id, name: "Japan", hist: [{ from: m2, amount: 150, freq: "maand" }] },
      { kind: "dep", potId: japan.id, name: "Japan", once: m0, amount: 100 },
    ].map(ex);
    S.items.push(...items);
    const byName = n => items.find(i => i.name === n).id;
    ["Salaris", "Zorgtoeslag", "Huur", "Energie", "Zorgverzekering", "Winterjas", "Kapper", "Buffer"].forEach(n => setPaid(m0, byName(n), true));
    S.balances[m0] = S.balances[m0] || { amount: 1240.35, at: Date.now() - 2 * 3600e3, example: true };
    S.balances[m1] = S.balances[m1] || { amount: 640.2, at: Date.now() - 25 * 864e5, example: true };
    if (!S.ccLog.length) {
      ccAdd("set", 412.6, { amount: 412.6, month: m1, date: m1 + "-28", example: true });
      ccAdd("pay", -412.6, { amount: 412.6, month: m0, date: m0 + "-06", example: true });
      ccAdd("set", 175.89, { amount: 175.89, month: m0, date: m0 + "-07", example: true });
    }
    persist(); render();
  }
  function unseed() {
    const ids = new Set(S.items.filter(i => i.example).map(i => i.id));
    S.items = S.items.filter(i => !i.example);
    S.pots = S.pots.filter(p => !p.example);
    Object.keys(S.paid).forEach(m => ids.forEach(id => setPaid(m, id, false)));
    Object.keys(S.balances).forEach(m => { if (S.balances[m].example) delete S.balances[m]; });
    S.ccLog.filter(e => e.example).forEach(ccRemove);
    persist(); render();
  }

  function checkNewMonth() {
    const n = ym(new Date());
    if (n === NOW) return;
    const wasNow = S.month === NOW;
    NOW = n;
    if (wasNow) { S.month = n; if (!host.firstChild) render(); }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkNewMonth(); });
  window.addEventListener("pageshow", checkNewMonth);
  window.addEventListener("focus", checkNewMonth);

  applyTheme();
  if (PREVIEW && S.fresh) seed(); else render();
  if (!PREVIEW && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>

</body>
