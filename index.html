<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">

<meta name="description" content="Je inkomsten, vaste lasten, aankopen, creditcard en Klarna per maand. Alles blijft op je eigen telefoon.">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
<style>
/* Layout: app-scherm met tegels in een raster — verwachting bovenaan, daarnaast rekening en wat je overhoudt, daaronder vier bloktegels (inkomsten, vaste lasten, creditcard, Klarna); tabbalk onderin. */
:root {
  --bg: #EBEFF5;
  --surface: #FFFFFF;
  --ink: #111827;
  --muted: #586378;
  --line: #D8DFEA;
  --accent: #1F57C3;
  --accent-soft: #DCE6F8;
  --c-in: #1F57C3;
  --c-uit: #8592A8;
  --c-buy: #D08A1C;
  --c-cc: #6C4FC2;
  --c-kl: #C2507E;
  --c-sav: #0F7C8A;
  --neg: #B2392A;
  --neg-soft: #F6E0DB;
  --warn-soft: #F6ECD6;
  --scrim: rgba(12, 20, 16, .45);
  --r: 8px;
  --r-sm: 6px;
  --f-display: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C111B; --surface: #151C2A; --ink: #E5EAF3; --muted: #95A1B6; --line: #263044;
    --accent: #7FA9F5; --accent-soft: #1C2B4A; --c-in: #7FA9F5; --c-uit: #75829A; --c-buy: #E8AA4C; --c-cc: #A895EE; --c-kl: #E88BB1; --c-sav: #5CC6D3;
    --neg: #F0897A; --neg-soft: #3B221D; --warn-soft: #362C17; --scrim: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C111B; --surface: #151C2A; --ink: #E5EAF3; --muted: #95A1B6; --line: #263044;
  --accent: #7FA9F5; --accent-soft: #1C2B4A; --c-in: #7FA9F5; --c-uit: #75829A; --c-buy: #E8AA4C; --c-cc: #A895EE; --c-kl: #E88BB1; --c-sav: #5CC6D3;
  --neg: #F0897A; --neg-soft: #3B221D; --warn-soft: #362C17; --scrim: rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
.shell { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* bovenbalk */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px 8px; }
.logo { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.logo i { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); display: inline-grid; place-items: center; color: var(--surface); font-style: normal; font-size: .8rem; }
.month { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.month button { border: 0; background: none; width: 36px; height: 36px; font-size: 1.15rem; line-height: 1; border-radius: var(--r); }
.month button:active { background: var(--accent-soft); }
.month span { min-width: 8.6em; text-align: center; font-weight: 600; text-transform: capitalize; font-size: .92rem; }
.back { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 0; display: flex; align-items: center; gap: 4px; }

/* raster */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.hero, .fullrow { grid-column: 1 / -1; }
@media (min-width: 860px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .hero { grid-column: span 2; grid-row: span 2; }
  .wide2, .fullrow.wide2 { grid-column: span 2; }
}
.tile { background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; border: 1px solid transparent; }
.tile.click { cursor: pointer; }
.tile.click:hover { border-color: var(--line); }
.tile.click:active { background: var(--accent-soft); }
.t-head { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.t-head .lbl { flex: 1; min-width: 0; font-size: .9rem; font-weight: 600; color: var(--muted); border: 0; background: none; padding: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 9px; height: 9px; border-radius: 2px; background: var(--c); flex: none; }
.plus { border: 1px solid var(--line); background: var(--bg); width: 28px; height: 28px; border-radius: var(--r-sm); font-size: 1.05rem; line-height: 1; color: var(--ink); flex: none; }
.plus:active { background: var(--accent-soft); }
.t-total { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; letter-spacing: -.02em; line-height: 1.1; overflow-wrap: anywhere; }
.t-total.pos { color: var(--accent); }
.t-total.neg { color: var(--neg); }
.t-sub { font-size: .8rem; color: var(--muted); }
.t-list { list-style: none; margin: 2px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; font-size: .82rem; }
.t-list li { display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.t-list li span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.t-list li span:last-child { white-space: nowrap; font-weight: 600; }
.t-list .more { color: var(--muted); }

/* verwachting */
.hero { padding: 18px; gap: 12px; justify-content: space-between; }
.eyebrow { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
.big { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(2.3rem, 10vw, 3.3rem); line-height: 1; letter-spacing: -.03em; color: var(--accent); }
.big.neg { color: var(--neg); }
.sum-line { margin: 0; font-size: .88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.sum-line b { color: var(--ink); font-weight: 600; }
.bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; background: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; font-size: .8rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.prompt { background: var(--warn-soft); border-radius: var(--r-sm); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .88rem; }

/* detailscherm */
.dhead { display: flex; flex-direction: column; gap: 4px; padding: 4px 2px 0; }
.dhead h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.dhead .dot { width: 12px; height: 12px; }
.dhead p { margin: 0; color: var(--muted); }
.list { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 0; background: none; text-align: left; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
button.row:active, button.row:hover { background: var(--accent-soft); }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .name { font-weight: 500; overflow-wrap: anywhere; }
.row .meta { font-size: .8rem; color: var(--muted); }
.row .amt { font-weight: 600; white-space: nowrap; }
.row .amt.pos { color: var(--accent); }
.row .amt.neg { color: var(--neg); }
.tag { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--line); color: var(--muted); border-radius: 3px; padding: 1px 4px; margin-left: 6px; vertical-align: 1px; }
.tag.new { background: var(--accent-soft); color: var(--accent); }
.add { display: flex; align-items: center; gap: 8px; width: 100%; padding: 13px 14px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font-weight: 600; text-align: left; }
.list > .add:first-child { border-top: 0; }
.add:active { background: var(--accent-soft); }
.hrow .name { text-transform: capitalize; }
.hrow.cur { background: var(--accent-soft); }
.mini { display: flex; height: 5px; border-radius: 2px; overflow: hidden; background: var(--bg); max-width: 260px; margin-top: 3px; }
.mini i { display: block; height: 100%; background: var(--c); }
.h2 { margin: 6px 2px 0; font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -.01em; }

.panel { background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel p { margin: 0; }
.panel h3 { margin: 0; font-size: 1rem; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 10px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--neg); border-color: var(--neg); background: none; }
.btn.danger.solid { background: var(--neg); color: var(--surface); }
.btn.small { padding: 6px 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: default; }
.link { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 2px; font-size: .86rem; align-self: flex-start; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
.note-ex { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--warn-soft); border-radius: var(--r-sm); padding: 8px 12px; font-size: .85rem; }

/* tabbalk */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(14px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
}
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 64px 1fr 1fr; align-items: center; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: .7rem; font-weight: 600; color: var(--muted); border-radius: var(--r-sm); }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }
.tab-add { justify-self: center; width: 52px; height: 52px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 1.7rem; line-height: 1; margin-top: -18px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

/* paneel van onderen */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 500px; border-radius: 12px 12px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow-y: auto;
}
@media (min-width: 600px) { .scrim { align-items: center; } .sheet { border-radius: 12px; } }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
.choose { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choose button { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 14px 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.choose button:active { background: var(--accent-soft); }
.choose b { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.choose small { color: var(--muted); font-size: .78rem; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field legend { font-size: .84rem; font-weight: 600; color: var(--muted); padding: 0; }
.field input, .field select {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 11px 12px; width: 100%; min-height: 46px;
}
.amount-wrap { position: relative; }
.amount-wrap span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; }
.amount-wrap input { padding-left: 30px; font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; }
fieldset.field { border: 0; margin: 0; padding: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 3px; gap: 3px; }
.seg { position: relative; }
.seg input, .field .seg input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; min-height: 0; padding: 0; margin: 0; left: 0; top: 0; }
.seg label { text-align: center; padding: 8px 4px; border-radius: 4px; font-weight: 600; color: var(--muted); cursor: pointer; font-size: .88rem; }
.seg input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); }
.sheet .btns { justify-content: space-between; }
.sheet .btns .right { display: flex; gap: 8px; margin-left: auto; }
.confirm { background: var(--neg-soft); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.confirm p { margin: 0; color: var(--neg); font-weight: 600; }
.confirm .hint { color: var(--ink); font-weight: 400; }
.err { margin: 0; color: var(--neg); font-size: .88rem; font-weight: 500; }

.crow { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.crow:first-of-type { border-top: 0; padding-top: 0; }
.clabel { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.clabel small { color: var(--muted); font-weight: 400; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 32px; height: 32px; border-radius: var(--r-sm); border: 3px solid var(--surface); background: var(--sw); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r-sm); z-index: 30; font-weight: 500; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(20px); opacity: .6; } }
}
</style>

<div class="shell">
  <header class="appbar" id="appbar"></header>
  <main id="app" class="shell" style="width:100%"></main>
</div>

<div class="tabbar"><nav aria-label="Navigatie">
  <button class="tab" data-tab="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>Overzicht</button>

</nav></div>

<script>
(function () {
  "use strict";
  const PREVIEW = false;          // in de voorvertoning: downloaden en installeren werken pas in de echte app
  const PALETTE = [
    ["blauw", "Blauw", "#1F57C3", "#7FA9F5"], ["indigo", "Indigo", "#4648C9", "#9CA0F7"], ["paars", "Paars", "#6C4FC2", "#A895EE"],
    ["roze", "Roze", "#C2507E", "#E88BB1"], ["rood", "Rood", "#C23B2E", "#F08A7C"], ["oranje", "Oranje", "#D0611C", "#F2A061"],
    ["amber", "Geel", "#C9861A", "#E8AA4C"], ["groen", "Groen", "#1D7A50", "#5DC29B"], ["teal", "Zeegroen", "#0F7C8A", "#5CC6D3"], ["grijs", "Grijs", "#7A879D", "#75829A"],
  ];
  const DEFAULT_COLORS = { accent: "blauw", in: "blauw", uit: "grijs", buy: "amber", cc: "paars", kl: "roze", sav: "teal" };
  const COLOR_TARGETS = [["accent", "Hoofdkleur", "Knoppen, je verwachting en wat je overhoudt"], ["in", "Inkomsten"], ["uit", "Vaste lasten"], ["buy", "Aankopen"], ["cc", "Creditcard"], ["kl", "Klarna"], ["sav", "Spaarrekening"]];
  const KEY = "saldo.v1";
  const CATS = ["Wonen", "Energie & water", "Verzekeringen", "Abonnementen", "Vervoer", "Boodschappen", "Sparen", "Kinderen", "Leningen", "Overig"];
  const KL_TERMS = [[1, "In één keer"], [3, "In 3 delen"], [6, "6 maanden"], [12, "12 maanden"], [24, "24 maanden"]];
  const BLOCKS = {
    in: { title: "Inkomsten", c: "var(--c-in)", fixed: true, add: "Inkomen toevoegen", what: "Salaris, toeslagen, uitkering" },
    uit: { title: "Vaste lasten", c: "var(--c-uit)", fixed: true, add: "Vaste last toevoegen", what: "Huur, energie, verzekeringen" },
    buy: { title: "Aankopen", c: "var(--c-buy)", fixed: false, add: "Aankoop toevoegen", what: "Pinbetalingen en andere losse uitgaven" },
    cc: { title: "Creditcard", c: "var(--c-cc)", fixed: false, add: "Tussenstand bijwerken", what: "Tussenstand van deze maand" },
    kl: { title: "Klarna", c: "var(--c-kl)", fixed: false, add: "Klarna-aankoop toevoegen", what: "Achteraf of in termijnen betaald" },
  };
  const eur = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
  const eur0 = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  const pad = n => String(n).padStart(2, "0");
  const ym = d => d.getFullYear() + "-" + pad(d.getMonth() + 1);
  const NOW = ym(new Date());
  const today = () => { const d = new Date(); return ym(d) + "-" + pad(d.getDate()); };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const FREQ = { maand: 1, kwartaal: 3, jaar: 12 };
  const FREQ_LABEL = { maand: "per maand", kwartaal: "per kwartaal", jaar: "per jaar" };
  const isMonth = s => /^\d{4}-(0[1-9]|1[0-2])$/.test(s || "");
  const addMonths = (m, n) => { const [y, mo] = m.split("-").map(Number); return ym(new Date(y, mo - 1 + n, 1)); };
  const monthsBetween = (a, b) => { const [y1, m1] = a.split("-").map(Number); const [y2, m2] = b.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1); };
  const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const r2 = v => Math.round(v * 100) / 100;

  function parseAmount(s, allowNeg) {
    s = String(s || "").replace(/[€\s]/g, "");
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    const n = Number(s);
    if (!isFinite(n) || s === "" || (!allowNeg && n < 0)) return NaN;
    return r2(n);
  }
  function monthName(m, withYear = true) {
    const [y, mo] = m.split("-").map(Number);
    return new Date(y, mo - 1, 1).toLocaleDateString("nl-NL", withYear ? { month: "long", year: "numeric" } : { month: "long" });
  }
  const shortMonth = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("nl-NL", { month: "short", year: "numeric" }); };
  const niceDate = ts => new Date(ts).toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
  function whenText(ts) {
    const d = new Date(ts), n = new Date();
    const t = d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === n.toDateString()) return "vandaag om " + t;
    const y = new Date(n); y.setDate(n.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return "gisteren om " + t;
    return d.toLocaleDateString("nl-NL", { day: "numeric", month: "short" }) + " om " + t;
  }

  /* vaste posten hebben een geschiedenis [{from, amount, freq}] en gaan zo vanzelf mee naar volgende maanden */
  const histOf = it => (Array.isArray(it.hist) && it.hist.length ? it.hist : [{ from: "0000-01", amount: Number(it.amount) || 0, freq: it.freq || "maand" }])
    .slice().sort((a, b) => a.from.localeCompare(b.from));
  function entryAt(it, m) {
    if (it.until && m >= it.until) return null;
    let e = null;
    for (const h of histOf(it)) if (h.from <= m) e = h;
    return e;
  }
  const monthly = e => e ? (Number(e.amount) || 0) / (FREQ[e.freq] || 1) : 0;
  function klarnaAt(it, m) {
    const k = monthsBetween(it.start, m), n = Number(it.terms) || 1;
    if (k < 0 || k >= n) return null;
    return { share: (Number(it.amount) || 0) / n, nr: k + 1, of: n };
  }

  /* ---------- opslag op dit toestel ---------- */
  function load() {
    try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && Array.isArray(d.items)) return d; } catch (e) {}
    return null;
  }
  const saved = load();
  const S = {
    items: saved ? saved.items : [], balances: (saved && saved.balances) || {}, ccs: (saved && saved.ccs) || {}, savs: (saved && saved.savs) || {}, lastBackup: saved ? saved.lastBackup || null : null,
    month: NOW, view: "overview", pendingRestore: null, fresh: !saved,
    set: Object.assign({ name: "Saldo", theme: "auto" }, saved && saved.set, { colors: Object.assign({}, DEFAULT_COLORS, saved && saved.set && saved.set.colors) }),
  };
  const appName = () => (S.set.name || "").trim() || "Saldo";

  /* ---------- kleuren en thema ---------- */
  const root = document.documentElement;
  let themeIsOurs = false;
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  function isDark() {
    if (S.set.theme === "dark") return true;
    if (S.set.theme === "light") return false;
    const host = themeIsOurs ? null : root.getAttribute("data-theme");
    return host ? host === "dark" : mq.matches;
  }
  function applyTheme() {
    if (S.set.theme === "auto") { if (themeIsOurs) { root.removeAttribute("data-theme"); themeIsOurs = false; } }
    else { root.setAttribute("data-theme", S.set.theme); themeIsOurs = true; }
    const dark = isDark();
    const col = id => { const p = PALETTE.find(x => x[0] === id) || PALETTE[0]; return dark ? p[3] : p[2]; };
    const c = S.set.colors;
    root.style.setProperty("--accent", col(c.accent));
    root.style.setProperty("--accent-soft", `color-mix(in srgb, ${col(c.accent)} ${dark ? 22 : 15}%, var(--surface))`);
    ["in", "uit", "buy", "cc", "kl", "sav"].forEach(k => root.style.setProperty("--c-" + k, col(c[k])));
    const mt = document.querySelector('meta[name="theme-color"]');
    if (mt) mt.setAttribute("content", getComputedStyle(root).getPropertyValue("--bg").trim() || (dark ? "#0C111B" : "#EBEFF5"));
  }
  try { mq.addEventListener("change", () => { applyTheme(); render(); }); } catch (e) {}
  try { new MutationObserver(() => { if (S.set.theme === "auto" && !themeIsOurs) applyTheme(); }).observe(root, { attributes: true, attributeFilter: ["data-theme"] }); } catch (e) {}
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 1, items: S.items, balances: S.balances, ccs: S.ccs, savs: S.savs, set: S.set, lastBackup: S.lastBackup })); }
    catch (e) { toast("Opslaan lukte niet. Je toestel blokkeert opslag of zit vol."); }
  }
  function upsert(item) { const i = S.items.findIndex(x => x.id === item.id); if (i >= 0) S.items[i] = item; else S.items.push(item); persist(); render(); }
  function removeItem(id) { S.items = S.items.filter(x => x.id !== id); persist(); render(); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

  /* ---------- berekening per maand ---------- */
  function calc(m) {
    const r = { in: [], uit: [], buy: [], cc: [], kl: [] };
    for (const it of S.items) {
      if (it.kind === "in" || it.kind === "uit") { const e = entryAt(it, m); if (e) r[it.kind].push({ it, e, v: monthly(e) }); }
      else if (it.kind === "buy") { if (String(it.date || "").startsWith(m)) r[it.kind].push({ it, v: Number(it.amount) || 0 }); }
      else if (it.kind === "kl") { const k = klarnaAt(it, m); if (k) r.kl.push({ it, k, v: k.share }); }
    }
    r.in.sort((a, b) => b.v - a.v); r.uit.sort((a, b) => b.v - a.v);
    r.cc.sort((a, b) => String(b.it.date).localeCompare(String(a.it.date)));
    r.buy.sort((a, b) => String(b.it.date).localeCompare(String(a.it.date)));
    r.kl.sort((a, b) => b.v - a.v);
    const t = k => r[k].reduce((s, x) => s + x.v, 0);
    r.ccStand = S.ccs[m] || null;
    r.sav = S.savs[m] || null;
    const prevSav = Object.keys(S.savs).filter(x => x < m).sort().pop();
    r.savPrev = prevSav ? { month: prevSav, ...S.savs[prevSav] } : null;
    r.t = { in: t("in"), uit: t("uit"), buy: t("buy"), cc: r.ccStand ? r.ccStand.amount : 0, kl: t("kl") };
    r.costs = r.t.uit + r.t.buy + r.t.cc + r.t.kl;
    r.over = r.t.in - r.costs;
    r.bal = S.balances[m] || null;
    r.expected = r.bal ? r.bal.amount + r.over : null;
    return r;
  }
  function firstMonth() {
    let f = null;
    const see = m => { if (isMonth(m) && (!f || m < f)) f = m; };
    for (const it of S.items) see(it.kind === "buy" ? String(it.date || "").slice(0, 7) : it.kind === "kl" ? it.start : histOf(it)[0].from);
    Object.keys(S.balances).forEach(see); Object.keys(S.ccs).forEach(see); Object.keys(S.savs).forEach(see);
    return f;
  }

  /* ---------- weergave ---------- */
  const app = document.getElementById("app");
  const appbar = document.getElementById("appbar");
  let toastT;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2800);
  }
  function go(view) { S.view = view; render(); window.scrollTo({ top: 0 }); }

  function render() {
    const v = S.view;
    const monthNav = `<div class="month" aria-label="Maand kiezen"><button data-act="prev" aria-label="Vorige maand">‹</button><span class="num">${esc(monthName(S.month))}</span><button data-act="next" aria-label="Volgende maand">›</button></div>`;
    appbar.innerHTML = v.startsWith("detail:")
      ? `<button class="back" data-act="home">‹ Overzicht</button>${monthNav}`
      : `<p class="logo"><i>€</i><span id="logoName">${esc(appName())}</span></p>${v === "overview" ? monthNav : ""}`;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.tab === v ? "page" : "false"));
    if (v === "overview") app.innerHTML = overview();
    else if (v.startsWith("detail:")) app.innerHTML = detail(v.slice(7));
    else if (v === "history") app.innerHTML = history();
    else app.innerHTML = more();
  }

  function overview() {
    const c = calc(S.month);
    const mName = monthName(S.month, false);
    const isNow = S.month === NOW;
    let h = "";
    if (S.items.some(i => i.example)) h += `<div class="note-ex"><span>Je ziet voorbeeldbedragen.</span><button class="btn small" data-act="unseed">Wis voorbeelden en begin</button></div>`;
    if (!isNow) h += `<div class="note-ex"><span>Je bekijkt ${S.month < NOW ? "een eerdere" : "een komende"} maand.</span><button class="btn small" data-act="now">Naar deze maand</button></div>`;

    const scale = Math.max(c.t.in, c.costs) || 1;
    const seg = (val, col) => val > 0 ? `<i style="width:${(val / scale * 100).toFixed(2)}%;--c:${col}"></i>` : "";
    const bar = `<div class="bar" role="img" aria-label="Van je inkomen: vaste lasten ${eur.format(c.t.uit)}, aankopen ${eur.format(c.t.buy)}, creditcard ${eur.format(c.t.cc)}, Klarna ${eur.format(c.t.kl)}, over ${eur.format(Math.max(0, c.over))}">
      ${seg(c.t.uit, "var(--c-uit)")}${seg(c.t.buy, "var(--c-buy)")}${seg(c.t.cc, "var(--c-cc)")}${seg(c.t.kl, "var(--c-kl)")}${seg(c.over, "var(--accent)")}</div>`;
    const legend = `<ul class="legend num"><li><span class="dot" style="--c:var(--c-uit)"></span>Vast ${eur0.format(c.t.uit)}</li>
      <li><span class="dot" style="--c:var(--c-buy)"></span>Aankopen ${eur0.format(c.t.buy)}</li>
      <li><span class="dot" style="--c:var(--c-cc)"></span>Creditcard ${eur0.format(c.t.cc)}</li>
      <li><span class="dot" style="--c:var(--c-kl)"></span>Klarna ${eur0.format(c.t.kl)}</li>
      <li><span class="dot" style="--c:var(--accent)"></span>Over ${eur0.format(c.over)}</li></ul>`;

    let hero;
    if (c.bal) {
      hero = `<section class="tile hero" aria-live="polite">
        <div><p class="eyebrow">Verwacht eind ${esc(mName)}</p></div>
        <p class="big num ${c.expected < 0 ? "neg" : ""}">${eur.format(c.expected)}</p>
        <p class="sum-line num"><b>${eur.format(c.bal.amount)}</b> op je rekening <span>${c.over < 0 ? "−" : "+"}</span> <b>${eur.format(Math.abs(c.over))}</b> ${c.over < 0 ? "tekort" : "over"} van je inkomen</p>
        ${bar}${legend}</section>`;
    } else {
      hero = `<section class="tile hero" aria-live="polite">
        <div><p class="eyebrow">Over van je inkomen in ${esc(mName)}</p></div>
        <p class="big num ${c.over < 0 ? "neg" : ""}">${eur.format(c.over)}</p>
        <div class="prompt"><span>Vul je saldo in om te zien wat je eind ${esc(mName)} op je rekening hebt.</span><button class="btn small primary" data-add="bal">Saldo invullen</button></div>
        ${bar}${legend}</section>`;
    }

    const balTile = `<section class="tile click" data-add="bal" style="--c:var(--ink)">
      <div class="t-head"><span class="dot"></span><button class="lbl" data-add="bal">Rekening</button></div>
      <div class="t-total num">${c.bal ? eur.format(c.bal.amount) : "—"}</div>
      <div class="t-sub">${c.bal ? "Bijgewerkt " + esc(whenText(c.bal.at)) : "Tik om je saldo in te vullen"}</div></section>`;
    const overTile = `<section class="tile" style="--c:var(--accent)">
      <div class="t-head"><span class="dot"></span><span class="lbl">Over na kosten</span></div>
      <div class="t-total num ${c.over < 0 ? "neg" : "pos"}">${eur.format(c.over)}</div>
      <div class="t-sub num">${eur0.format(c.t.in)} in − ${eur0.format(c.costs)} kosten</div></section>`;

    h += `<div class="grid">${hero}${balTile}${savTile(c)}${overTile}${["in", "uit", "buy", "cc", "kl"].map(k => blockTile(k, c)).join("")}</div>`;
    if (!S.items.length) h += `<section class="panel"><h3>Begin met je inkomsten en vaste lasten</h3>
      <p class="hint">Die gaan elke maand vanzelf mee. Creditcard en Klarna vul je in als er iets is afgeschreven.</p>
      <div class="btns"><button class="btn primary" data-add="in">Inkomen toevoegen</button><button class="btn" data-act="seed">Laad voorbeeldbedragen</button></div></section>`;
    return h;
  }

  function savTile(c) {
    let delta = "";
    if (c.sav && c.savPrev) {
      const d = c.sav.amount - c.savPrev.amount;
      delta = `<div class="t-sub num" style="color:${d < 0 ? "var(--neg)" : "var(--c-sav)"};font-weight:600">${d < 0 ? "−" : "+"} ${eur.format(Math.abs(d))} sinds ${esc(monthName(c.savPrev.month, false))}</div>`;
    }
    return `<section class="tile click" data-add="sav" style="--c:var(--c-sav)">
      <div class="t-head"><span class="dot"></span><button class="lbl" data-add="sav">Sparen</button><button class="plus" data-add="sav" aria-label="Spaarstand bijwerken">✎</button></div>
      <div class="t-total num">${c.sav ? eur.format(c.sav.amount) : "—"}</div>
      ${delta}<div class="t-sub">${c.sav ? "Bijgewerkt " + esc(whenText(c.sav.at)) : c.savPrev ? "Laatste stand " + esc(eur.format(c.savPrev.amount)) + " in " + esc(monthName(c.savPrev.month, false)) : "Tik om je spaarstand in te vullen"}</div></section>`;
  }

  function blockTile(k, c) {
    const b = BLOCKS[k], rows = c[k], total = c.t[k];
    if (k === "cc") return `<section class="tile click" data-add="cc" style="--c:${b.c}">
      <div class="t-head"><span class="dot"></span><button class="lbl" data-add="cc">Creditcard</button><button class="plus" data-add="cc" aria-label="Tussenstand bijwerken">✎</button></div>
      <div class="t-total num">${c.ccStand ? "− " + eur.format(total) : "—"}</div>
      <div class="t-sub">${c.ccStand ? "Tussenstand, bijgewerkt " + esc(whenText(c.ccStand.at)) : "Tik om je tussenstand in te vullen"}</div>
      <div class="t-sub">Gaat eind van de maand van je inkomen af.</div></section>`;
    const label = r => esc(r.it.name);
    const val = r => eur.format(r.v);
    const show = rows.slice(0, 3);
    const sub = rows.length
      ? (k === "buy" ? `${rows.length} aankop${rows.length === 1 ? "" : "en"}` : k === "cc" ? `${rows.length} afschrijving${rows.length === 1 ? "" : "en"}` : k === "kl" ? `${rows.length} betaling${rows.length === 1 ? "" : "en"} deze maand` : `${rows.length} post${rows.length === 1 ? "" : "en"} · gaat elke maand mee`)
      : (k === "buy" ? "Nog geen aankopen" : k === "cc" ? "Nog niets afgeschreven" : k === "kl" ? "Geen termijnen deze maand" : "Nog niets ingevuld");
    return `<section class="tile click" data-open="${k}" style="--c:${b.c}">
      <div class="t-head"><span class="dot"></span><button class="lbl" data-open="${k}">${b.title}</button><button class="plus" data-add="${k}" aria-label="${esc(b.add)}">+</button></div>
      <div class="t-total num">${k === "in" ? "" : "− "}${eur.format(total)}</div>
      <div class="t-sub">${sub}</div>
      ${show.length ? `<ul class="t-list num">${show.map(r => `<li><span>${label(r)}</span><span>${val(r)}</span></li>`).join("")}${rows.length > 3 ? `<li class="more">en nog ${rows.length - 3}</li>` : ""}</ul>` : ""}
    </section>`;
  }

  function detail(k) {
    const b = BLOCKS[k], c = calc(S.month), rows = c[k], mName = monthName(S.month, false);
    const rowHtml = rows.map(r => {
      const it = r.it; let meta = "", tag = "";
      if (b.fixed) {
        const hst = histOf(it);
        if (hst[0].from === S.month) tag = '<span class="tag new">nieuw</span>';
        else if (r.e.from === S.month) tag = '<span class="tag new">gewijzigd</span>';
        meta = (it.cat ? esc(it.cat) + " · " : "") + (r.e.freq === "maand" ? "per maand" : `${eur.format(r.e.amount)} ${FREQ_LABEL[r.e.freq]}`) +
          (it.until ? ` · t/m ${esc(shortMonth(addMonths(it.until, -1)))}` : "");
      } else if (k === "cc" || k === "buy") {
        meta = new Date(it.date + "T12:00").toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" });
      } else {
        meta = r.k.of === 1 ? "In één keer" : `Termijn ${r.k.nr} van ${r.k.of} · totaal ${eur.format(it.amount)}`;
      }
      if (it.example) tag += '<span class="tag">voorbeeld</span>';
      return `<button class="row" data-edit="${esc(it.id)}"><span class="txt"><span class="name">${esc(it.name)}${tag}</span><span class="meta num">${meta}</span></span>
        <span class="amt num ${k === "in" ? "pos" : ""}">${k === "in" ? "+" : "−"} ${eur.format(r.v)}</span></button>`;
    }).join("");
    const empty = !rows.length ? `<div class="row"><span class="meta">Niets in ${esc(mName)}.</span></div>` : "";
    const explain = b.fixed ? "Gaat elke maand vanzelf mee. Pas je een bedrag aan, dan houden eerdere maanden het oude bedrag."
      : k === "buy" ? "Pinbetalingen en andere losse uitgaven. Dit gaat van wat je deze maand overhoudt af."
      : k === "cc" ? "Wat er deze maand al van je creditcard is afgeschreven. Dit gaat eind van de maand van je inkomen af."
      : "Klarna-aankopen in termijnen worden automatisch over de maanden verdeeld.";
    return `<div class="dhead" style="--c:${b.c}"><h1><span class="dot"></span>${b.title}</h1>
      <p class="num"><b>${eur.format(c.t[k])}</b> in ${esc(mName)}</p><p class="hint">${explain}</p></div>
      <div class="list">${rowHtml}${empty}<button class="add" data-add="${k}">+ ${esc(b.add)}</button></div>`;
  }

  function history() {
    const first = firstMonth();
    if (!first) return `<h1 class="h2">Maanden</h1><section class="panel"><p class="hint">Zodra je bedragen invult, zie je hier per maand wat er binnenkwam, wat eraf ging en wat je overhield.</p></section>`;
    const last = S.month > NOW ? S.month : NOW;
    const months = [];
    for (let m = last; m >= first && months.length < 36; m = addMonths(m, -1)) months.push(m);
    const rows = months.map(m => {
      const c = calc(m), sc = Math.max(c.t.in, c.costs) || 1;
      const w = v => (Math.max(0, v) / sc * 100).toFixed(1) + "%";
      return `<button class="row hrow ${m === S.month ? "cur" : ""}" data-month="${m}"><span class="txt"><span class="name">${esc(monthName(m))}</span>
        <span class="mini" aria-hidden="true"><i style="width:${w(c.t.uit)};--c:var(--c-uit)"></i><i style="width:${w(c.t.buy)};--c:var(--c-buy)"></i><i style="width:${w(c.t.cc)};--c:var(--c-cc)"></i><i style="width:${w(c.t.kl)};--c:var(--c-kl)"></i><i style="width:${w(c.over)};--c:var(--accent)"></i></span>
        <span class="meta num">${eur0.format(c.t.in)} in · ${eur0.format(c.costs)} kosten${c.bal ? " · rekening " + eur0.format(c.bal.amount) : ""}</span></span>
        <span class="amt num ${c.over < 0 ? "neg" : "pos"}">${eur.format(c.over)}</span></button>`;
    }).join("");
    return `<h1 class="h2">Maanden</h1><p class="hint" style="padding:0 2px">Tik op een maand om die te openen. Rechts staat wat je overhield.</p><div class="list">${rows}</div>`;
  }

  function more() {
    let restore = "";
    if (S.pendingRestore) {
      restore = `<div class="confirm"><p>Back-up terugzetten?</p>
        <p class="hint">Dit vervangt wat nu in de app staat (${S.items.length} posten) door de back-up (${S.pendingRestore.items.length} posten${S.pendingRestore.date ? ", gemaakt op " + esc(niceDate(S.pendingRestore.date)) : ""}).</p>
        <div class="btns"><button class="btn danger solid" data-act="restore-yes">Terugzetten</button><button class="btn" data-act="restore-no">Annuleren</button></div></div>`;
    }
    const dark = isDark();
    const colorRows = COLOR_TARGETS.map(([key, label, sub]) => {
      const cur = S.set.colors[key];
      const name = (PALETTE.find(x => x[0] === cur) || PALETTE[0])[1];
      return `<div class="crow"><span class="clabel">${esc(label)} <small>${esc(sub || name)}</small></span>
        <div class="swatches" role="radiogroup" aria-label="Kleur voor ${esc(label)}">${PALETTE.map(([id, nm, l, d]) =>
          `<button class="sw" role="radio" aria-checked="${id === cur}" aria-label="${nm}" title="${nm}" data-color="${key}:${id}" style="--sw:${dark ? d : l}"></button>`).join("")}</div></div>`;
    }).join("");
    const th = [["auto", "Automatisch"], ["light", "Licht"], ["dark", "Donker"]];
    return `<h1 class="h2">Instellingen</h1>
      <section class="panel"><h3>Kleuren</h3>${colorRows}
        <button class="link" data-act="reset-colors">Standaardkleuren terugzetten</button></section>
      <section class="panel"><h3>Weergave</h3>
        <fieldset class="field"><legend>Licht of donker</legend><div class="seg">${th.map(([v, l]) => `<input type="radio" name="theme" id="th-${v}" value="${v}" ${S.set.theme === v ? "checked" : ""}><label for="th-${v}">${l}</label>`).join("")}</div>
        <p class="hint">Automatisch volgt de instelling van je telefoon.</p></fieldset></section>
      <section class="panel"><h3>Naam van de app</h3>
        <div class="field"><label for="set-name">Naam bovenin</label><input id="set-name" maxlength="20" autocomplete="off" value="${esc(S.set.name)}" placeholder="Saldo"></div>
        <p class="hint">De naam onder het icoon op je beginscherm kies je zelf bij het installeren.</p></section>
      <h2 class="h2">Back-up en export</h2>
      <section class="panel"><h3>Je gegevens</h3>
        <p class="hint">Alles staat alleen op dit toestel. Er is geen account en niemand anders kan erbij. ${S.lastBackup ? "Laatste back-up: " + esc(niceDate(S.lastBackup)) + "." : "Er is nog geen back-up gemaakt."}</p>
        <div class="btns"><button class="btn primary" data-act="backup" ${S.items.length ? "" : "disabled"}>Back-up maken</button>
        <button class="btn" data-act="excel" ${S.items.length ? "" : "disabled"}>Download als Excel</button>
        <button class="btn" data-act="restore">Back-up terugzetten</button></div>${restore}</section>
      <section class="panel"><h3>Voorbeeldbedragen</h3>
        <div class="btns">${S.items.some(i => i.example) ? `<button class="btn" data-act="unseed">Voorbeelden wissen</button>` : `<button class="btn" data-act="seed">Voorbeelden laden</button>`}</div></section>`;
  }

  /* ---------- klikken ---------- */
  document.addEventListener("click", e => {
    if (e.target.closest("#sheetHost")) return;
    const t = e.target;
    const tab = t.closest("[data-tab]"); if (tab) { const v = tab.dataset.tab; return go(v); }
    if (t.closest("#tabAdd")) return openChooser();
    const add = t.closest("[data-add]"); if (add) { const k = add.dataset.add; return k === "bal" || k === "cc" || k === "sav" ? openStand(k) : openSheet(k); }
    const ed = t.closest("[data-edit]"); if (ed) { const it = S.items.find(i => i.id === ed.dataset.edit); if (it) openSheet(it.kind, it); return; }
    const op = t.closest("[data-open]"); if (op) return go("detail:" + op.dataset.open);
    const hm = t.closest("[data-month]"); if (hm) { S.month = hm.dataset.month; return go("overview"); }
    const sw = t.closest("[data-color]"); if (sw) { const [k, id] = sw.dataset.color.split(":"); S.set.colors[k] = id; persist(); applyTheme(); render(); return; }
    const a = t.closest("[data-act]"); if (!a) return;
    switch (a.dataset.act) {
      case "reset-colors": S.set.colors = Object.assign({}, DEFAULT_COLORS); persist(); applyTheme(); render(); toast("Standaardkleuren terug"); break;
      case "prev": S.month = addMonths(S.month, -1); render(); break;
      case "next": S.month = addMonths(S.month, 1); render(); break;
      case "home": go("overview"); break;
      case "now": S.month = NOW; render(); break;
      case "seed": seed(); toast("Voorbeeldbedragen geladen"); break;
      case "unseed": S.items = S.items.filter(i => !i.example); [S.balances, S.ccs, S.savs].forEach(o => Object.keys(o).forEach(m => { if (o[m].example) delete o[m]; })); persist(); render(); toast("Voorbeelden gewist"); break;
      case "backup": backup(); break;
      case "excel": exportXlsx(a); break;
      case "restore": if (PREVIEW) return toast("Terugzetten werkt in de echte app op je telefoon."); document.getElementById("restoreInput").click(); break;
      case "restore-no": S.pendingRestore = null; render(); break;
      case "restore-yes": S.items = S.pendingRestore.items; S.balances = S.pendingRestore.balances; S.ccs = S.pendingRestore.ccs; S.savs = S.pendingRestore.savs; if (S.pendingRestore.set) { S.set = Object.assign(S.set, S.pendingRestore.set); applyTheme(); } S.pendingRestore = null; S.month = NOW; persist(); go("overview"); toast("Back-up teruggezet"); break;
    }
  });

  document.addEventListener("change", e => {
    if (e.target.name === "theme") { S.set.theme = e.target.value; persist(); applyTheme(); render(); }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "set-name") { S.set.name = e.target.value; persist(); const l = document.getElementById("logoName"); if (l) l.textContent = appName(); }
  });

  /* ---------- panelen ---------- */
  const host = document.getElementById("sheetHost");
  let lastFocus = null;
  function mount(html, focusId) {
    lastFocus = document.activeElement;
    host.innerHTML = `<div class="scrim" id="scrim">${html}</div>`;
    document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
    const cancel = document.getElementById("f-cancel"); if (cancel) cancel.onclick = closeSheet;
    setTimeout(() => { const f = document.getElementById(focusId); if (f) f.focus(); }, 30);
  }
  function closeSheet() { host.innerHTML = ""; if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus(); }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && host.firstChild) closeSheet(); });
  function showErr(msg, focusId) {
    const el = document.getElementById("f-err"); if (!el) return;
    el.textContent = msg; el.hidden = false; if (focusId) document.getElementById(focusId).focus();
  }

  function openChooser() {
    const opt = (k, title, sub, c) => `<button type="button" data-pick="${k}"><b><span class="dot" style="--c:${c}"></span>${title}</b><small>${sub}</small></button>`;
    mount(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><h2 id="sh-t">Wat wil je toevoegen?</h2>
      <div class="choose">${opt("buy", "Aankoop", "Pinbetaling of losse uitgave", "var(--c-buy)")}${opt("cc", "Creditcard", "Tussenstand bijwerken", "var(--c-cc)")}${opt("kl", "Klarna", "Aankoop of termijnen", "var(--c-kl)")}
      ${opt("uit", "Vaste last", "Elke maand", "var(--c-uit)")}
      ${opt("in", "Inkomen", "Elke maand", "var(--c-in)")}${opt("bal", "Saldo", "Stand lopende rekening", "var(--ink)")}${opt("sav", "Spaarrekening", "Spaarstand bijwerken", "var(--c-sav)")}</div>
      <div class="btns"><div class="right"><button type="button" class="btn" id="f-cancel">Annuleren</button></div></div></div>`);
    host.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const k = b.dataset.pick; closeSheet(); k === "bal" || k === "cc" || k === "sav" ? openStand(k) : openSheet(k); });
  }

  function openStand(type) {
    const C = {
      bal: { store: S.balances, title: "Saldo lopende rekening", q: "Wat staat er nu op je rekening?", note: "Rood staan? Zet er een min voor.", neg: true, c: "var(--ink)", ok: "Saldo bijgewerkt" },
      cc: { store: S.ccs, title: "Tussenstand creditcard", q: "Hoeveel staat er deze maand tot nu toe op je creditcard?", note: "Dit bedrag gaat eind van de maand van je inkomen af.", neg: false, c: "var(--c-cc)", ok: "Tussenstand bijgewerkt" },
      sav: { store: S.savs, title: "Spaarrekening", q: "Hoeveel staat er nu op je spaarrekening?", note: "Telt niet mee in wat je overhoudt. Zo zie je per maand hoe je spaargeld groeit.", neg: false, c: "var(--c-sav)", ok: "Spaarstand bijgewerkt" },
    }[type];
    const store = C.store, cur = store[S.month];
    mount(`<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate>
      <h2 id="sh-t"><span class="dot" style="--c:${C.c}"></span>${C.title}</h2>
      <div class="field"><label for="f-bal">${C.q}</label><div class="amount-wrap"><span>€</span>
        <input id="f-bal" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${cur ? esc(String(cur.amount).replace(".", ",")) : ""}"></div>
        <p class="hint">Geldt voor ${esc(monthName(S.month))}. ${cur ? "Vorige stand: " + esc(whenText(cur.at)) + "." : ""} ${C.note}</p></div>
      <p class="err" id="f-err" hidden></p>
      <div class="btns"><div class="right"><button type="button" class="btn" id="f-cancel">Annuleren</button><button type="submit" class="btn primary">Opslaan</button></div></div></form>`, "f-bal");
    document.getElementById("sheet").addEventListener("submit", e => {
      e.preventDefault();
      const v = parseAmount(document.getElementById("f-bal").value, C.neg);
      if (isNaN(v)) return showErr("Vul een bedrag in, bijvoorbeeld 1.250,00.", "f-bal");
      store[S.month] = { amount: v, at: Date.now() };
      persist(); closeSheet(); render(); toast(C.ok);
    });
  }

  function openSheet(kind, item) {
    const b = BLOCKS[kind], isEdit = !!item, fixed = b.fixed, mName = monthName(S.month);
    const ph = { in: "Bijv. salaris", uit: "Bijv. huur", buy: "Bijv. nieuwe schoenen", cc: "Bijv. Albert Heijn", kl: "Bijv. Zalando" };
    const cur = fixed && item ? (entryAt(item, S.month) || histOf(item).slice(-1)[0]) : null;
    const amount = fixed ? cur?.amount : item?.amount;
    const freq = cur?.freq || "maand";
    const cat = item?.cat || "Wonen";
    const defDate = item?.date || (S.month === NOW ? today() : S.month + "-01");
    const terms = item?.terms || 3;
    let extra = "";
    if (fixed) extra = `<fieldset class="field"><legend>Hoe vaak</legend><div class="seg">
        ${["maand", "kwartaal", "jaar"].map(f => `<input type="radio" name="freq" id="f-freq-${f}" value="${f}" ${f === freq ? "checked" : ""}><label for="f-freq-${f}">Per ${f}</label>`).join("")}
        </div><p class="hint" id="f-hint"></p></fieldset>
        <div class="field"><label for="f-from">${isEdit ? "Nieuw bedrag geldt vanaf" : "Geldt vanaf"}</label><input type="month" id="f-from" value="${S.month}" placeholder="2026-11">
        <p class="hint">${isEdit ? "Maanden daarvoor houden het oude bedrag." : "Gaat daarna elke maand vanzelf mee."}</p></div>
        ${kind === "uit" ? `<div class="field"><label for="f-cat">Soort</label><select id="f-cat">${CATS.map(k => `<option ${k === cat ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></div>` : ""}`;
    if (kind === "cc" || kind === "buy") extra = `<div class="field"><label for="f-date">${kind === "cc" ? "Afgeschreven op" : "Datum"}</label><input type="date" id="f-date" value="${esc(defDate)}"></div>`;
    if (kind === "kl") extra = `<div class="field"><label for="f-terms">Betalen</label><select id="f-terms">${KL_TERMS.map(([n, l]) => `<option value="${n}" ${n === Number(terms) ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="field"><label for="f-start">Eerste betaling in</label><input type="month" id="f-start" value="${esc(item?.start || S.month)}" placeholder="2026-11"><p class="hint" id="f-hint"></p></div>`;

    mount(`<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate>
      <h2 id="sh-t"><span class="dot" style="--c:${b.c}"></span>${isEdit ? "Bewerken" : b.add}</h2>
      <div class="field"><label for="f-name">Omschrijving</label><input id="f-name" maxlength="60" autocomplete="off" placeholder="${ph[kind]}" value="${esc(item?.name || "")}"></div>
      <div class="field"><label for="f-amount">${kind === "kl" ? "Totaalbedrag" : "Bedrag"}</label><div class="amount-wrap"><span>€</span>
        <input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${amount != null ? esc(String(amount).replace(".", ",")) : ""}"></div></div>
      ${extra}
      <p class="err" id="f-err" hidden></p>
      <div class="confirm" id="f-confirm" hidden>
        ${fixed ? `<p>Wat wil je met “${esc(item?.name || "")}”?</p><p class="hint">Stoppen houdt de post in eerdere maanden, zodat je geschiedenis klopt.</p>
          <div class="btns"><button type="button" class="btn danger solid" id="f-stop">Stoppen vanaf ${esc(mName)}</button><button type="button" class="btn danger" id="f-del-yes">Overal verwijderen</button><button type="button" class="btn" id="f-del-no">Toch niet</button></div>`
        : `<p>“${esc(item?.name || "")}” verwijderen?</p><div class="btns"><button type="button" class="btn danger solid" id="f-del-yes">Verwijderen</button><button type="button" class="btn" id="f-del-no">Toch niet</button></div>`}
      </div>
      <div class="btns">${isEdit ? `<button type="button" class="btn danger" id="f-del">${fixed ? "Stoppen of verwijderen" : "Verwijderen"}</button>` : ""}
        <div class="right"><button type="button" class="btn" id="f-cancel">Annuleren</button><button type="submit" class="btn primary">Opslaan</button></div></div></form>`, isEdit ? "f-amount" : "f-name");

    const $ = id => document.getElementById(id);
    const hint = () => {
      const h = $("f-hint"); if (!h) return;
      const a = parseAmount($("f-amount").value);
      if (kind === "kl") {
        const n = Number($("f-terms").value), s = $("f-start").value;
        h.textContent = a > 0 && n > 1 && isMonth(s) ? `${eur.format(a / n)} per maand, van ${monthName(s)} t/m ${monthName(addMonths(s, n - 1))}.` : "";
      } else {
        const f = (document.querySelector('input[name="freq"]:checked') || {}).value;
        h.textContent = f && f !== "maand" && a > 0 ? `Telt mee als ${eur.format(a / FREQ[f])} per maand.` : "";
      }
    };
    hint();
    host.querySelectorAll("input, select").forEach(el => { el.addEventListener("input", hint); el.addEventListener("change", hint); });

    if (isEdit) {
      $("f-del").onclick = () => { $("f-confirm").hidden = false; ($("f-stop") || $("f-del-yes")).focus(); };
      $("f-del-no").onclick = () => { $("f-confirm").hidden = true; };
      $("f-del-yes").onclick = () => { removeItem(item.id); closeSheet(); toast("Verwijderd"); };
      if ($("f-stop")) $("f-stop").onclick = () => {
        if (histOf(item)[0].from >= S.month) removeItem(item.id); else upsert({ ...item, until: S.month, updatedAt: Date.now() });
        closeSheet(); toast(`Gestopt vanaf ${mName}`);
      };
    }
    $("sheet").addEventListener("submit", e => {
      e.preventDefault();
      const name = $("f-name").value.trim(), amt = parseAmount($("f-amount").value);
      if (!name) return showErr("Vul een omschrijving in.", "f-name");
      if (!(amt > 0)) return showErr("Vul een bedrag in, bijvoorbeeld 49,95.", "f-amount");
      const base = { id: isEdit ? item.id : newId(), kind, name, updatedAt: Date.now() };
      if (isEdit && item.example) base.example = true;
      let data;
      if (fixed) {
        const from = $("f-from").value.trim();
        if (!isMonth(from)) return showErr("Kies een maand, bijvoorbeeld 2026-11.", "f-from");
        const f = (document.querySelector('input[name="freq"]:checked') || {}).value || "maand";
        let hist = isEdit ? histOf(item) : [];
        const prev = isEdit ? entryAt({ ...item, until: null }, from) : null;
        if (!prev || prev.amount !== amt || prev.freq !== f) hist = hist.filter(h => h.from !== from).concat({ from, amount: amt, freq: f }).sort((a, b) => a.from.localeCompare(b.from));
        data = { ...base, hist };
        if (kind === "uit") data.cat = $("f-cat").value;
        if (isEdit && item.until && item.until > from) data.until = item.until;
        if (!isEdit && from > S.month) S.month = from;
      } else if (kind === "cc" || kind === "buy") {
        data = { ...base, amount: amt, date: $("f-date").value || today() };
        if (!data.date.startsWith(S.month)) S.month = data.date.slice(0, 7);
      } else {
        const start = $("f-start").value.trim();
        if (!isMonth(start)) return showErr("Kies de maand van de eerste betaling.", "f-start");
        data = { ...base, amount: amt, terms: Number($("f-terms").value) || 1, start };
      }
      upsert(data); closeSheet(); toast(isEdit ? "Opgeslagen" : "Toegevoegd");
    });
  }

  /* ---------- back-up en Excel ---------- */
  async function giveFile(blob, filename) {
    try {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; }
    } catch (e) { if (e && e.name === "AbortError") return false; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return true;
  }
  async function backup() {
    if (PREVIEW) return toast("Back-ups maken werkt in de echte app op je telefoon.");
    const payload = JSON.stringify({ app: "saldo", v: 1, date: Date.now(), items: S.items, balances: S.balances, ccs: S.ccs, savs: S.savs, set: S.set }, null, 1);
    if (await giveFile(new Blob([payload], { type: "application/json" }), `saldo-backup-${today()}.json`)) { S.lastBackup = Date.now(); persist(); render(); toast("Back-up gemaakt"); }
  }
  document.getElementById("restoreInput").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d || d.app !== "saldo" || !Array.isArray(d.items)) throw 0;
        S.pendingRestore = { items: d.items.filter(i => i && i.id && i.kind), balances: d.balances || {}, ccs: d.ccs || {}, savs: d.savs || {}, set: d.set || null, date: d.date || null }; render();
      } catch (err) { toast("Dit bestand is geen back-up van " + appName() + "."); }
    };
    rd.readAsText(f);
  });
  let xlsxP = null;
  const loadXlsx = () => window.XLSX ? Promise.resolve() : (xlsxP = xlsxP || new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "xlsx.full.min.js"; s.onload = res; s.onerror = () => { xlsxP = null; rej(); }; document.head.appendChild(s);
  }));
  if (!PREVIEW) setTimeout(() => loadXlsx().catch(() => {}), 1500);
  async function exportXlsx(btn) {
    if (PREVIEW) return toast("Excel downloaden werkt in de echte app op je telefoon.");
    if (!window.XLSX) { btn.disabled = true; try { await loadXlsx(); toast("Klaar. Tik nog een keer op Download als Excel."); } catch (e) { toast("Het Excel-onderdeel kon niet laden. Probeer het met internet opnieuw."); } btn.disabled = false; return; }
    const first = firstMonth() || NOW, months = [];
    for (let m = first; m <= NOW; m = addMonths(m, 1)) months.push(m);
    const per = [["Maand", "Inkomsten", "Vaste lasten", "Aankopen", "Creditcard", "Klarna", "Over", "Saldo rekening", "Verwacht eind maand", "Spaarrekening"]]
      .concat(months.map(m => { const c = calc(m); return [monthName(m), r2(c.t.in), r2(c.t.uit), r2(c.t.buy), r2(c.t.cc), r2(c.t.kl), r2(c.over), c.bal ? c.bal.amount : "", c.expected != null ? r2(c.expected) : "", c.sav ? c.sav.amount : ""]; }));
    const fixedRows = [["Soort", "Omschrijving", "Categorie", "Vanaf", "Tot en met", "Bedrag", "Hoe vaak", "Per maand"]];
    S.items.filter(i => i.kind === "in" || i.kind === "uit").forEach(it => {
      const h = histOf(it);
      h.forEach((e, k) => fixedRows.push([it.kind === "in" ? "Inkomen" : "Vaste last", it.name, it.cat || "", e.from === "0000-01" ? "" : e.from,
        k < h.length - 1 ? addMonths(h[k + 1].from, -1) : (it.until ? addMonths(it.until, -1) : ""), e.amount, FREQ_LABEL[e.freq], r2(monthly(e))]));
    });
    const buys = [["Datum", "Omschrijving", "Bedrag"]].concat(S.items.filter(i => i.kind === "buy").sort((a, b) => a.date.localeCompare(b.date)).map(i => [i.date, i.name, i.amount]));
    const kl = [["Omschrijving", "Totaal", "Termijnen", "Eerste betaling", "Per termijn"]].concat(S.items.filter(i => i.kind === "kl").map(i => [i.name, i.amount, i.terms, i.start, r2(i.amount / i.terms)]));
    const wb = XLSX.utils.book_new();
    const add = (rows, name, w) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = w.map(x => ({ wch: x })); XLSX.utils.book_append_sheet(wb, ws, name); };
    add(per, "Per maand", [16, 11, 12, 10, 11, 9, 10, 14, 18, 14]); add(fixedRows, "Vaste posten", [11, 24, 16, 9, 11, 10, 13, 10]);
    add(buys, "Aankopen", [12, 28, 10]); add(kl, "Klarna", [24, 10, 10, 14, 11]);
    const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
    await giveFile(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `saldo-${today()}.xlsx`);
  }

  /* ---------- voorbeelden ---------- */
  function seed() {
    const m0 = S.month, m1 = addMonths(m0, -1), m2 = addMonths(m0, -2);
    const d = (m, day) => m + "-" + pad(day);
    [
      { kind: "in", name: "Salaris", hist: [{ from: m2, amount: 2850, freq: "maand" }] },
      { kind: "in", name: "Zorgtoeslag", hist: [{ from: m2, amount: 123, freq: "maand" }] },
      { kind: "uit", name: "Huur", cat: "Wonen", hist: [{ from: m2, amount: 1150, freq: "maand" }] },
      { kind: "uit", name: "Energie", cat: "Energie & water", hist: [{ from: m2, amount: 130, freq: "maand" }, { from: m0, amount: 145, freq: "maand" }] },
      { kind: "uit", name: "Zorgverzekering", cat: "Verzekeringen", hist: [{ from: m2, amount: 152, freq: "maand" }] },
      { kind: "uit", name: "Inboedelverzekering", cat: "Verzekeringen", hist: [{ from: m2, amount: 96, freq: "jaar" }] },
      { kind: "uit", name: "Telefoon en streaming", cat: "Abonnementen", hist: [{ from: m2, amount: 42, freq: "maand" }] },
      { kind: "uit", name: "Boodschappen", cat: "Boodschappen", hist: [{ from: m2, amount: 380, freq: "maand" }] },
      { kind: "buy", name: "Winterjas", amount: 129.95, date: d(m0, 2) },
      { kind: "buy", name: "Kapper", amount: 32, date: d(m0, 4) },
      { kind: "buy", name: "Verjaardagscadeau", amount: 45, date: d(m1, 12) },
      { kind: "kl", name: "Zalando", amount: 89.97, terms: 3, start: m1 },
